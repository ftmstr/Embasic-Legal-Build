name: TUR081 military source repair (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur081-military-snapshot.yml']
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15022263838'
          run-id: '45618167694'
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15254404769'
          run-id: '46125710964'
          github-token: ${{ github.token }}
          path: base
      - name: Install independent extractor
        run: sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends poppler-utils
      - name: Source and isolated repair
        run: |
          python3 - <<'PY'
          import pathlib as P,sqlite3 as S,hashlib as H,json as J,shutil,subprocess,unicodedata,re
          def sha(p):return H.sha256(p.read_bytes()).hexdigest()
          def norm(t):return ' '.join(unicodedata.normalize('NFC',t).split())
          pdf=next(P.Path('source').rglob('u15.pdf'));base=next(P.Path('base').rglob('reader-candidate.sqlite')).parent
          g=base/'grammar-repaired.sqlite';r=base/'reader-candidate.sqlite';prev=base/'boundary-review.json';out=P.Path('out');out.mkdir(exist_ok=True)
          inputs=[pdf,g,r,prev];before=list(map(sha,inputs));checks=[]
          def test(n,v):
              assert v,n
              checks.append({'case':n,'pass':True})
          test('exact_inputs',before==['e66404cf48ef79bf83bb425df04f98f4063a77fbdee99bcdf4a1d8f2f905f35d','62056c81b8ea9bd6ed86ae2f400fa3748fb6fddc13d96cf450db3013299cd576','3e46cf18e90c9a95175ae2e073d31ef41a8ebea86b63f39535c5bee7f417509b','309f2d360b1d47001564349f8f426d2d54349fd1d60f6ba9c540fb655a66c344'])
          s=S.connect(g.resolve().as_uri()+'?mode=ro',uri=True);s.row_factory=S.Row
          def a(n):return f'1632:normal:{n}'
          def line(p,o):return dict(s.execute('select * from line where law=1632 and page=? and ordinal=?',(p,o)).fetchone())
          def ev(x):return {'page':x['page'],'ordinal':x['ordinal'],'raw':x['raw'],'bbox':J.loads(x['bbox']),'source_text_sha256':H.sha256(x['raw'].encode()).hexdigest()}
          def members(n):return [dict(x) for x in s.execute('select m.*,l.raw,l.bbox,l.classification,l.spans from membership m join line l using(law,page,ordinal) where article_id=? order by page,ordinal',(a(n),))]
          def coords(rs):return [(x['page'],x['ordinal']) for x in rs]
          ss=[]
          for p,c in [(42,27),(43,26),(44,31),(45,36)]:
              raw=[dict(x) for x in s.execute('select * from line where law=1632 and page=? order by ordinal',(p,))]
              test(f'p{p}_independent_text',len(raw)==c and [x['ordinal'] for x in raw]==list(range(c)) and norm(subprocess.check_output(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-'],text=True))==norm(' '.join(x['raw'] for x in raw)))
              ss.extend((p,x['ordinal'],z['text']) for x in raw for z in J.loads(x['spans']) if z['flags']&1 and z['text'].strip())
          test('superscript_inventory',ss==[(43,12,'39'),(44,2,'40'),(44,7,'41'),(45,24,'4243')])
          rows=[];anns=[];roles=[];records={};removed=set()
          specs={172:6,173:10,174:14}
          for n,o,leak in [(172,6,[7,8]),(173,10,[11,12]),(174,14,[15,16,17])]:
              rs=members(n)
              test(f'm{n}_exact_repeal_and_boundary',coords(rs)==[(42,o)]+[(42,k) for k in leak] and rs[0]['body']=='(Mülga: 31/1/2013-6413/45 md.)' and rs[0]['raw']==f'Madde {n} – '+rs[0]['body'] and not s.execute('select 1 from node where article_id=?',(a(n),)).fetchall() and not s.execute('select 1 from grammar_overlay where parent_id=?',(a(n),)).fetchall())
              t=ev(line(42,o-1))
              test(f'm{n}_title',line(42,o-1)['classification']=='HEADING_CANDIDATE')
              anns.append((a(n),'TITLE',42,o-1,t['raw'],t['source_text_sha256']))
              roles.append((1632,42,o-1,a(n),'TITLE',t['source_text_sha256']))
              rows.append((a(n),1632,42,o,rs[0]['body']))
              removed.update((a(n),1632,x['page'],x['ordinal'],x['body']) for x in rs[1:])
              records[str(n)]={'body':[ev(rs[0])],'titles':[t],'footnotes':[],'legal_paragraph_number':None}
          for o,kind in [(7,'BAP_HEADING'),(8,'BAP_HEADING'),(11,'BAP_HEADING'),(12,'BAP_HEADING'),(15,'BAP_HEADING'),(16,'BAP_HEADING'),(17,'SECTION_HEADING')]:
              roles.append((1632,42,o,None,kind,ev(line(42,o))['source_text_sha256']))
          test('structural_headings',[line(42,o)['raw'] for o in (7,11,15,17)]==['ÜÇÜNCÜ BAP','DÖRDÜNCÜ BAP','BEŞİNCİ BAP','I - CEZANIN VERİLMESİ'])
          def e(n):return f'1632:ek:{n}'
          def am(aid):return [dict(x) for x in s.execute('select m.*,l.raw,l.bbox,l.classification,l.spans from membership m join line l using(law,page,ordinal) where article_id=? order by page,ordinal',(aid,))]
          defects={a(181):('SECTION_HEADING_LEAK',[(43,5)]),a(185):('MISSING_FOOTNOTE39',[(43,12),(43,24),(43,25)]),a(187):('BAP_HEADING_LEAK',[(43,18),(43,19)]),a(188):('NEXT_TITLE_LEAK',[(43,23)]),a(189):('TITLE_AND_BAP_FOOTNOTE40_LEAK',[(43,23),(44,2),(44,3),(44,29)]),a(190):('BAP_FOOTNOTE41_LEAK',[(44,7),(44,8),(44,30)]),e(1):('MISSING_LITERAL_MARKERS',[(45,7),(45,8)]),e(2):('MISSING_LITERAL_MARKERS',[(45,15),(45,16)]),e(3):('MISSING_BODY_AND_FOOTNOTES42_43',[(45,24),(45,32),(45,33),(45,34),(45,35)]),e(4):('MISSING_LITERAL_MARKER',[(45,27)])}
          for aid,cs in [(a(181),[(43,5)]),(a(187),[(43,18),(43,19)]),(a(188),[(43,23)]),(a(189),[(44,2),(44,3)]),(a(190),[(44,7),(44,8)])]:
              test(aid+'_leak',coords(am(aid))[-len(cs):]==cs)
          test('m185_footnote39',line(43,24)['raw'].startswith('39 ') and line(43,25)['classification']=='FOOTNOTE_CANDIDATE')
          test('m189_title_from_previous',(43,23) in coords(am(a(188))) and (43,23) not in coords(am(a(189))))
          test('bap_footnotes40_41_not_article',line(44,2)['raw']=='YEDİNCİ BAP40' and line(44,7)['raw']=='SEKİZİNCİ BAP41' and line(44,29)['raw'].startswith('40 ') and line(44,30)['raw'].startswith('41 '))
          for n,cs in [(1,[(45,7),(45,8)]),(2,[(45,15),(45,16)]),(4,[(45,27)])]:
              test(e(n)+'_missing_literal',all(c in coords(am(e(n))) for c in cs) and all(line(*c)['raw'].startswith(('A) ','B) ')) for c in cs) and not s.execute('select 1 from node where article_id=?',(e(n),)).fetchall() and not s.execute('select 1 from grammar_overlay where parent_id=?',(e(n),)).fetchall())
          test('ek3_missing_final_body_and_footnotes',coords(am(e(3)))==[(45,o) for o in range(19,24)] and line(45,24)['raw']=='2012/108 sayılı Kararı ile.)4243' and line(45,32)['raw'].startswith('42 ') and line(45,33)['raw'].startswith('43 ') and all(line(45,o)['classification']=='FOOTNOTE_CANDIDATE' for o in range(32,36)))
          for aid,(reason,cs) in defects.items():
              records[aid]={'decision':'WITHHELD_REVIEW','reason':reason,'source_evidence':[ev(line(*c)) for c in cs],'legacy_membership':[ev(x) for x in am(aid)]}
          gdpath=out/g.name;shutil.copyfile(g,gdpath);gd=S.connect(gdpath);gd.execute('pragma foreign_keys=ON');gd.execute('attach database ? as old',(g.resolve().as_uri()+'?mode=ro',))
          def diff(db,t,rev=False):
              x,y=('old.','') if rev else ('','old.')
              return set(db.execute(f'select * from {x}{t} except select * from {y}{t}'))
          gd.executemany('delete from membership where article_id=? and law=? and page=? and ordinal=?',[x[:4] for x in sorted(removed)])
          gd.executemany('insert into source_boundary_repair values(?,?,?,?,?,?)',roles)
          test('seven_wrong_memberships_removed',len(removed)==7 and not diff(gd,'membership') and diff(gd,'membership',True)==removed)
          test('ten_new_roles',len(roles)==10 and diff(gd,'source_boundary_repair')==set(roles) and not diff(gd,'source_boundary_repair',True) and gd.execute('select count(*) from source_boundary_repair').fetchone()==(104,) and not gd.execute('select 1 from membership m join source_boundary_repair z using(law,page,ordinal)').fetchall())
          tables=[x[0] for x in gd.execute("select name from old.sqlite_master where type='table'")]
          test('other_grammar_tables_unchanged',all(not diff(gd,t) and not diff(gd,t,True) for t in tables if t not in ('membership','source_boundary_repair')))
          gd.commit();test('grammar_integrity',gd.execute('pragma integrity_check').fetchone()==('ok',) and not gd.execute('pragma foreign_key_check').fetchall());gd.close()
          dst=out/r.name;shutil.copyfile(r,dst);d=S.connect(dst);d.execute('pragma foreign_keys=ON');d.execute('attach database ? as old',(r.resolve().as_uri()+'?mode=ro',));q=lambda sql,args=():d.execute(sql,args).fetchall()
          test('baseline',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1505),('WITHHELD_REVIEW',3)] and q('select count(*) from reader_line')==[(18531,)] and q('select count(*) from reader_annotation')==[(195,)])
          targets=[a(n) for n in specs];holds=list(defects);quarantined=set()
          for aid,(reason,cs) in defects.items():
              rr=set(q('select * from reader_line where article_id=?',(aid,)))
              test(aid+'_candidate_exact_membership',q('select status from article_index where id=?',(aid,))==[('CANDIDATE_UNVERIFIED',)] and not q('select 1 from reader_annotation where article_id=?',(aid,)) and rr=={(aid,1632,x['page'],x['ordinal'],x['body']) for x in am(aid)})
              quarantined.update(rr)
              d.execute("update article_index set status='WITHHELD_REVIEW',reason=? where id=?",(reason,aid))
              d.execute('delete from reader_line where article_id=?',(aid,))
          for aid in targets:
              assert q('select status from article_index where id=?',(aid,))==[('WITHHELD_REVIEW',)]
              d.execute("update article_index set status='CANDIDATE_UNVERIFIED',reason='SOURCE_BOUNDARY_REVIEW_ONLY' where id=?",(aid,))
          d.executemany('insert into reader_line values(?,?,?,?,?)',rows);d.executemany('insert into reader_annotation values(?,?,?,?,?,?)',anns);d.execute("update metadata set value='TUR081' where key='projection_revision'")
          test('thirteen_index_changes',all({x[0] for x in diff(d,'article_index',v)}==set(targets+holds) for v in (False,True)) and {x[:6] for x in diff(d,'article_index')}=={x[:6] for x in diff(d,'article_index',True)})
          test('3_body_add_55_remove',len(rows)==3 and len(quarantined)==55 and diff(d,'reader_line')==set(rows) and diff(d,'reader_line',True)==quarantined)
          test('3_annotations_add',len(anns)==3 and diff(d,'reader_annotation')==set(anns) and not diff(d,'reader_annotation',True))
          test('counts',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1498),('WITHHELD_REVIEW',10)] and q('select count(*) from reader_line')==[(18479,)] and q('select count(*) from reader_annotation')==[(198,)])
          test('ten_held_exact',set(q("select id from article_index where status='WITHHELD_REVIEW'"))=={(x,) for x in holds})
          test('no_leak',not q("select 1 from reader_line where article_id in (select id from article_index where status='WITHHELD_REVIEW')") and not q("select 1 from reader_annotation where article_id in (select id from article_index where status='WITHHELD_REVIEW')") and not q('select 1 from reader_line r join reader_annotation z on r.law=(select law from article_index where id=z.article_id) and r.page=z.page and r.ordinal=z.ordinal'))
          test('metadata_only_revision',diff(d,'metadata')=={('projection_revision','TUR081')} and diff(d,'metadata',True)=={('projection_revision','TUR080')})
          test('temporal_preserved',not diff(d,'temporal_decision') and not diff(d,'temporal_decision',True) and q('select count(*) from temporal_decision')==[(11,)] and all(not J.loads(x[0])['automatic_effect'] for x in q('select record from temporal_decision')))
          test('ktk_2863_preserved',all(q('select status,count(*) from article_index where law=? group by status',(law,))==[('CANDIDATE_UNVERIFIED',n)] for law,n in [(2918,187),(2863,98)]))
          for p in base.glob('*.json'):
              if p.name!='result.json':shutil.copyfile(p,out/('tur080-boundary-review.json' if p.name=='boundary-review.json' else p.name))
          rv=J.loads((out/'review-only.json').read_bytes());m95=J.loads((out/'tur069-boundary-review.json').read_bytes())
          test('prior_json_and_m95_preserved',all(sha(p)==sha(out/('tur080-boundary-review.json' if p.name=='boundary-review.json' else p.name)) for p in base.glob('*.json') if p.name!='result.json') and len(rv['overlay_review'])==119 and len(rv['list_review'])==19 and sum(len(x['members']) for x in rv['list_review'])==90 and len(J.loads((out/'tur058-boundary-review.json').read_bytes())['definition_anchors'])==90 and len(m95['records']['95']['overlay_additions'])==9 and len(m95['records']['95']['references'])==3 and m95['legacy_nodes_authoritative'] is False)
          d.commit();test('reader_integrity',q('pragma integrity_check')==[('ok',)] and not q('pragma foreign_key_check'));d.close();s.close()
          test('original_bytes_unchanged',before==list(map(sha,inputs)))
          (out/'boundary-review.json').write_text(J.dumps({'records':records,'body_rows':rows,'annotations':anns,'new_nodes':[],'new_overlays':[],'removed_membership':sorted(removed),'source_boundary_roles':roles,'quarantined_removed_rows':sorted(quarantined),'unconditional_hold':list(defects),'legacy_nodes_authoritative':False,'legal_acceptance':False,'promotion_allowed':False},ensure_ascii=False,indent=2),encoding='utf-8')
          result={'status':'TUR081_BOUNDARY_CANDIDATE_ONLY','promotion_allowed':False,'production':'NO-GO','reader_sha256':sha(dst),'grammar_sha256':sha(gdpath),'inputs':before,'checks':checks,'candidate_articles':1498,'withheld_articles':10,'body_rows':18479,'annotations':198}
          (out/'result.json').write_text(J.dumps(result,indent=2),encoding='utf-8');print(J.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR081-Military-Snapshot-NOT-RELEASE
          path: out/
          if-no-files-found: error
