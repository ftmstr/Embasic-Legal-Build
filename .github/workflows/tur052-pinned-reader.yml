name: TUR052 historical provision quarantine and pinned reader (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur052-pinned-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15057816038'
          run-id: '45687953803'
          github-token: ${{ github.token }}
          path: prior49
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15056664563'
          run-id: '45688754638'
          github-token: ${{ github.token }}
          path: prior50
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15058496001'
          run-id: '45689770047'
          github-token: ${{ github.token }}
          path: prior51
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060085952'
          run-id: '45693327586'
          github-token: ${{ github.token }}
          path: prior52
      - name: Verify known historical defect quarantine without changing originals
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess,sys,sqlite3
          paths={f"TUR{i}":next(pathlib.Path(f"prior{i}").rglob("reader-candidate.sqlite")) for i in range(49,53)}
          r=pathlib.Path("tur052-pin-evidence");r.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={k:sha(p) for k,p in paths.items()}
          checks=[]
          def test(n,v):
              if not v:raise RuntimeError(n)
              checks.append({"case":n,"pass":True})
          def call(rev,aid,generic=False,dbrev=None):
              p=paths[dbrev or rev]
              args=["tools/audit_candidate_reader.py","--db",str(p),"--expected-sha256",sha(p)] if generic else ["tools/audit_pinned_reader.py","--db",str(p),"--revision",rev]
              return subprocess.run([sys.executable,*args,"--article",aid],capture_output=True,text=True,encoding="utf-8")
          def denied(p,reason):
              return p.returncode==65 and not p.stdout and json.loads(p.stderr)["reason"]==reason
          aid="2918:geçici:27"
          for rev in ("TUR049","TUR050"):
              db=sqlite3.connect(paths[rev].resolve().as_uri()+"?mode=ro",uri=True)
              old=db.execute("SELECT page,ordinal FROM reader_line WHERE article_id=? ORDER BY page,ordinal",(aid,)).fetchall()
              db.close()
              test(rev+"_original_known_defect_present",old==[(98,o) for o in range(12,37)]+[(99,0),(99,1)])
              test(rev+"_pinned_quarantine",denied(call(rev,aid),"REVISION_ARTICLE_QUARANTINED"))
              test(rev+"_generic_quarantine",denied(call(rev,aid,True),"REVISION_ARTICLE_QUARANTINED"))
          test("TUR051_pinned_quarantine",denied(call("TUR051",aid),"REVISION_ARTICLE_QUARANTINED"))
          q=call("TUR052",aid);v=json.loads(q.stdout)
          test("TUR052_exact_corrected_body",q.returncode==0 and [(x["page"],x["ordinal"]) for x in v["body"]]==[(98,o) for o in range(12,34)] and len(v["body"])==22 and v["evidence"]["artifact"]==15060085952 and not v["promotion_allowed"])
          test("TUR052_generic_same_corrected_body",(q:=call("TUR052",aid,True)).returncode==0 and json.loads(q.stdout)["body"]==v["body"])
          test("cross_revision_hash_rejected",denied(call("TUR052",aid,dbrev="TUR050"),"HASH_MISMATCH") and denied(call("TUR050",aid,dbrev="TUR052"),"HASH_MISMATCH"))
          test("historical_unaffected_article_still_readable",all(call(rev,"6114:normal:21").returncode==0 for rev in ("TUR049","TUR050","TUR051","TUR052")))
          test("other_held_article_still_denied",denied(call("TUR052","2918:normal:51"),"WITHHELD_REVIEW"))
          test("all_four_input_bytes_unchanged",before=={k:sha(p) for k,p in paths.items()})
          out={"status":"PINNED_AUDIT_READER_ONLY","promotion_allowed":False,"production":"NO-GO","official_legal_source":"NOT_VERIFIED","physical_uat":"NOT_RUN","checks":checks,"input_hashes":before,"wrapper_sha256":sha(pathlib.Path("tools/audit_pinned_reader.py")),"generic_reader_sha256":sha(pathlib.Path("tools/audit_candidate_reader.py")),"limitations":["known article-specific quarantine in current code only; historical source and direct SQLite access remain possible","generic caller-supplied hash and metadata not independent authority","no general freshness or Windows product integration"]}
          (r/"result.json").write_text(json.dumps(out,indent=2),encoding="utf-8")
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TUR052-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur052-pin-evidence/
          if-no-files-found: error
