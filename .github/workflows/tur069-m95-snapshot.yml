name: TUR069 m95 nested source repair (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur069-m95-snapshot.yml']
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15022263838'
          run-id: '45618167694'
          github-token: ${{ github.token }}
          path: source44
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15032941250'
          run-id: '45634365330'
          github-token: ${{ github.token }}
          path: grammar47
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15226202525'
          run-id: '46056242011'
          github-token: ${{ github.token }}
          path: prior68
      - name: Install independent extractor
        run: sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends poppler-utils
      - name: Repair coordinate overlay and isolated reader
        run: |
          python3 - <<'PY'
          import pathlib as P,sqlite3 as S,hashlib as H,json as J,shutil,subprocess,unicodedata,re
          def sha(p):return H.sha256(p.read_bytes()).hexdigest()
          def file(d,n):return next(P.Path(d).rglob(n))
          def norm(t):return ' '.join(unicodedata.normalize('NFC',t).split())
          pdf=file('source44','u15.pdf');g=file('grammar47','grammar-candidate.sqlite');base=file('prior68','reader-candidate.sqlite');prev=file('prior68','boundary-review.json')
          inputs=[pdf,g,base,prev];before=list(map(sha,inputs));checks=[]
          def test(n,v):
              assert v,n
              checks.append({'case':n,'pass':True})
          test('exact_inputs',before==['e66404cf48ef79bf83bb425df04f98f4063a77fbdee99bcdf4a1d8f2f905f35d','3945755b862a41a2b510c1afe78c1ab758f8d4e2dac70d37534082fa44805b7e','807cf592a55bb5b6fba60d1f678ed489d1d8bfc343e4f9f8883499a977f77fea','a1efeb32870898f28d2a14b6784274dea742b570d0ac7554bd9beeec3071ddb0'])
          s=S.connect(g.resolve().as_uri()+'?mode=ro',uri=True);s.row_factory=S.Row
          aid='1632:normal:95'
          def line(p,o):return dict(s.execute('select * from line where law=1632 and page=? and ordinal=?',(p,o)).fetchone())
          def ev(x):return {'page':x['page'],'ordinal':x['ordinal'],'raw':x['raw'],'bbox':J.loads(x['bbox']),'source_text_sha256':H.sha256(x['raw'].encode()).hexdigest()}
          for p,n in [(27,36),(28,33)]:
              raw=[dict(x) for x in s.execute('select * from line where law=1632 and page=? order by ordinal',(p,))]
              test(f'p{p}_full_text',len(raw)==n and norm(subprocess.check_output(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-'],text=True))==norm(' '.join(x['raw'] for x in raw)))
          coords=[(27,o) for o in range(22,36)]+[(28,o) for o in range(6)]
          rs=[dict(x) for x in s.execute('select m.*,l.raw,l.bbox,l.classification,l.spans from membership m join line l using(law,page,ordinal) where article_id=? order by page,ordinal',(aid,))]
          title=line(27,21);old=J.loads(prev.read_bytes())['records']['95']
          test('complete_body_and_title',[(x['page'],x['ordinal']) for x in rs]==coords and [ev(x) for x in rs]==old['body'] and ev(title)==old['title'] and title['classification']=='HEADING_CANDIDATE')
          test('body_header_only_removed',all(x['body']==(x['raw'].split(' – ',1)[1] if i==0 else x['raw']) for i,x in enumerate(rs)))
          test('amendment_and_no_footnote',rs[0]['body']=='(Değişik: 25/5/1972-1590/1 md.)' and not any(x['classification']=='FOOTNOTE_CANDIDATE' or any(z['flags']&1 and z['text'].strip().isdigit() for z in J.loads(x['spans'])) for x in rs+[title]))
          nums=[(27,23),(27,30),(27,32),(28,0),(28,3),(28,4)];letters=[(27,o) for o in range(25,29)]
          marks={(x['page'],x['ordinal']):re.match(r'^(\d+\.|[a-d]\))',x['body']).group(1) for x in rs if re.match(r'^(\d+\.|[a-d]\))',x['body'])}
          test('ten_exact_markers',marks==dict(zip(nums+letters,[f'{i}.' for i in range(1,7)]+[c+')' for c in 'abcd'])))
          nodes=[dict(x) for x in s.execute('select * from node where article_id=? order by page,ordinal',(aid,))]
          test('legacy_node_defect',len(nodes)==10 and all(x['parent']==aid+'/b:d' for x in nodes if (x['page'],x['ordinal']) in nums[1:]) and all(x['parent']==aid for x in nodes if (x['page'],x['ordinal']) in letters))
          oldoverlay=[dict(x) for x in s.execute('select * from grammar_overlay where law=1632 and (parent_id=? or parent_id like ?) order by page,ordinal',(aid,aid+'/%'))]
          test('single_original_overlay',oldoverlay==old['overlay'] and len(oldoverlay)==1 and (oldoverlay[0]['page'],oldoverlay[0]['ordinal'])==nums[0])
          first=oldoverlay[0]['new_id']; additions=[]
          for x in nodes:
              p,o=x['page'],x['ordinal']
              if (p,o)==nums[0]:continue
              isletter=(p,o) in letters
              additions.append((1632,p,o,x['id'],aid+f'/literal@{p}:{o}',first if isletter else aid,'clause_candidate' if isletter else 'legacy_paragraph_candidate','REVIEW_REQUIRED','TUR069 source-coordinate literal repair; no legal paragraph numbering'))
          out=P.Path('tur069-evidence');out.mkdir()
          repaired=out/'grammar-repaired.sqlite';shutil.copyfile(g,repaired)
          gd=S.connect(repaired);gd.execute('pragma foreign_keys=ON');gd.execute('attach database ? as old',(g.resolve().as_uri()+'?mode=ro',))
          gd.executemany('insert into grammar_overlay values(?,?,?,?,?,?,?,?,?)',additions)
          def diff(db,t,rev=False):
              a,b=('old.','') if rev else ('','old.')
              return set(db.execute(f'select * from {a}{t} except select * from {b}{t}').fetchall())
          test('overlay_exact_nine_additions',len(additions)==9 and diff(gd,'grammar_overlay')==set(additions) and not diff(gd,'grammar_overlay',True))
          tables=[x[0] for x in gd.execute("select name from main.sqlite_master where type='table' and name not like 'sqlite_%'")]
          test('all_other_grammar_tables_unchanged',all(not diff(gd,t) and not diff(gd,t,True) for t in tables if t!='grammar_overlay'))
          test('literal_parent_ownership',gd.execute('select count(*) from grammar_overlay where law=1632 and parent_id=?',(first,)).fetchone()==(4,) and gd.execute('select count(*) from grammar_overlay where law=1632 and parent_id=?',(aid,)).fetchone()==(6,))
          gd.commit();test('grammar_integrity',gd.execute('pragma integrity_check').fetchone()==('ok',) and not gd.execute('pragma foreign_key_check').fetchall());gd.close()
          # Source coverage partitions, not legal paragraph assignments.
          spans=[('amendment',[(27,22)]),('1_lead',[(27,23),(27,24)])]+[(c,[(27,o)]) for c,o in zip('abcd',range(25,29))]+[('1_shared_sanction',[(27,29)]),('2',[(27,30),(27,31)]),('3',[(27,o) for o in range(32,36)]),('4',[(28,o) for o in range(3)]),('5',[(28,3)]),('6',[(28,4),(28,5)])]
          test('partition_exact_no_overlap',[c for _,cc in spans for c in cc]==coords)
          test('shared_sanction_not_d',line(27,29)['raw'].startswith('Kim olursa olsun') and spans[5]==('d',[(27,28)]) and spans[6]==('1_shared_sanction',[(27,29)]))
          refs=[{'anchor':[27,30],'literal':'(a) fıkrasında','target':[27,25]},{'anchor':[27,30],'literal':'(b) fıkrasında','target':[27,26]},{'anchor':[28,4],'literal':'3 ve 4 üncü fıkralarında','targets':[[27,32],[28,0]]}]
          test('cross_reference_literal_only',all(r['literal'] in line(*r['anchor'])['raw'] for r in refs) and all(tuple(c) in marks for r in refs for c in (r['targets'] if 'targets' in r else [r['target']])))
          dst=out/'reader-candidate.sqlite';shutil.copyfile(base,dst);d=S.connect(dst);d.execute('pragma foreign_keys=ON');d.execute('attach database ? as old',(base.resolve().as_uri()+'?mode=ro',))
          def q(sql,args=()):return d.execute(sql,args).fetchall()
          test('neighbor94_and96',q('select page,ordinal from reader_line where article_id=? order by page,ordinal',('1632:normal:94',))==[(27,o) for o in range(14,21)] and q('select page,ordinal from reader_line where article_id=? order by page,ordinal',('1632:normal:96',))==[(28,o) for o in (7,8,9)] and line(28,6)['classification']=='HEADING_CANDIDATE')
          test('baseline',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1493),('WITHHELD_REVIEW',15)] and q('select count(*) from reader_line')==[(18455,)] and q('select count(*) from reader_annotation')==[(118,)] and q('select status from article_index where id=?',(aid,))==[('WITHHELD_REVIEW',)] and not q('select 1 from reader_line where article_id=?',(aid,)))
          rows=[(aid,1632,x['page'],x['ordinal'],x['body']) for x in rs];anns=[(aid,'TITLE',27,21,title['raw'],H.sha256(title['raw'].encode()).hexdigest())]
          d.execute("update article_index set status='CANDIDATE_UNVERIFIED',reason='SOURCE_BOUNDARY_REVIEW_ONLY' where id=?",(aid,));d.executemany('insert into reader_line values(?,?,?,?,?)',rows);d.executemany('insert into reader_annotation values(?,?,?,?,?,?)',anns);d.execute("update metadata set value='TUR069' where key='projection_revision'")
          test('only_m95_index_change',len(diff(d,'article_index'))==len(diff(d,'article_index',True))==1 and {x[:6] for x in diff(d,'article_index')}=={x[:6] for x in diff(d,'article_index',True)} and all(x[0]==aid for x in diff(d,'article_index')))
          test('20_body_and_one_title_only',diff(d,'reader_line')==set(rows) and len(rows)==20 and not diff(d,'reader_line',True) and diff(d,'reader_annotation')==set(anns) and not diff(d,'reader_annotation',True))
          test('counts',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1494),('WITHHELD_REVIEW',14)] and q('select count(*) from reader_line')==[(18475,)] and q('select count(*) from reader_annotation')==[(119,)])
          test('no_leak',not q("select 1 from reader_line where article_id in (select id from article_index where status='WITHHELD_REVIEW')") and not q('select 1 from reader_line r join reader_annotation a on r.law=(select law from article_index where id=a.article_id) and r.page=a.page and r.ordinal=a.ordinal'))
          test('metadata_only_revision',diff(d,'metadata')=={('projection_revision','TUR069')} and diff(d,'metadata',True)=={('projection_revision','TUR068')})
          test('temporal_unchanged',not diff(d,'temporal_decision') and not diff(d,'temporal_decision',True) and q('select count(*) from temporal_decision')==[(11,)] and all(not J.loads(x[0])['automatic_effect'] for x in q('select record from temporal_decision')))
          test('ktk_2863_preserved',all(q('select status,count(*) from article_index where law=? group by status',(law,))==[('CANDIDATE_UNVERIFIED',n)] for law,n in [(2918,187),(2863,98)]))
          for p in sorted(base.parent.glob('*.json')):
              if p.name!='result.json':shutil.copyfile(p,out/('tur068-boundary-review.json' if p.name=='boundary-review.json' else p.name))
          rv=J.loads((out/'review-only.json').read_bytes())
          test('review_records_preserved',len(rv['overlay_review'])==119 and len(rv['list_review'])==19 and sum(len(x['members']) for x in rv['list_review'])==90 and len(J.loads((out/'tur058-boundary-review.json').read_bytes())['definition_anchors'])==90 and all(sha(p)==sha(out/('tur068-boundary-review.json' if p.name=='boundary-review.json' else p.name)) for p in base.parent.glob('*.json') if p.name!='result.json'))
          d.commit();test('reader_integrity',q('pragma integrity_check')==[('ok',)] and not q('pragma foreign_key_check'));d.close();s.close()
          test('original_bytes_unchanged',before==list(map(sha,inputs)))
          (out/'boundary-review.json').write_text(J.dumps({'records':{'95':{'title':ev(title),'body':old['body'],'literal_markers':[[p,o,m] for (p,o),m in marks.items()],'spans':spans,'references':refs,'legacy_node_defect':nodes,'overlay_additions':additions,'legal_paragraph_number':None}},'body_rows':rows,'annotations':anns,'legacy_nodes_authoritative':False,'legal_acceptance':False,'promotion_allowed':False},ensure_ascii=False,indent=2),encoding='utf-8')
          result={'status':'TUR069_BOUNDARY_CANDIDATE_ONLY','promotion_allowed':False,'production':'NO-GO','reader_sha256':sha(dst),'grammar_sha256':sha(repaired),'inputs':before,'checks':checks,'candidate_articles':1494,'withheld_articles':14,'body_rows':18475,'annotations':119}
          (out/'result.json').write_text(J.dumps(result,indent=2),encoding='utf-8');print(J.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR069-M95-Snapshot-NOT-RELEASE
          path: tur069-evidence/
          if-no-files-found: error
