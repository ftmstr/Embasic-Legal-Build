name: TUR059 scope snapshot and historical quarantine (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur059-pinned-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15057816038'
          run-id: '45687953803'
          github-token: ${{ github.token }}
          path: prior49
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15056664563'
          run-id: '45688754638'
          github-token: ${{ github.token }}
          path: prior50
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15058496001'
          run-id: '45689770047'
          github-token: ${{ github.token }}
          path: prior51
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060085952'
          run-id: '45693327586'
          github-token: ${{ github.token }}
          path: prior52
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060641088'
          run-id: '45694684288'
          github-token: ${{ github.token }}
          path: prior53
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060707849'
          run-id: '45696360940'
          github-token: ${{ github.token }}
          path: prior54
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15064090183'
          run-id: '45700585363'
          github-token: ${{ github.token }}
          path: prior55
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093086567'
          run-id: '45768293248'
          github-token: ${{ github.token }}
          path: prior56
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093895209'
          run-id: '45769614123'
          github-token: ${{ github.token }}
          path: prior57
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15124392385'
          run-id: '45834946840'
          github-token: ${{ github.token }}
          path: prior58
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15137949379'
          run-id: '45862843182'
          github-token: ${{ github.token }}
          path: prior59
      - name: Verify new exact snapshot, historical denials and prior access compatibility
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess,sys,sqlite3,tempfile,shutil
          paths={f"TUR{i:03d}":next(pathlib.Path(f"prior{i}").rglob("reader-candidate.sqlite")) for i in range(49,60)}
          r=pathlib.Path("tur059-pin-evidence");r.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={k:sha(p) for k,p in paths.items()}
          checks=[]
          def test(n,v):
              assert v,n
              checks.append({"case":n,"pass":True})
          def call(rev,aid,generic=False,path=None):
              p=path or paths[rev]
              args=["tools/audit_candidate_reader.py","--db",str(p),"--expected-sha256",sha(p)] if generic else ["tools/audit_pinned_reader.py","--db",str(p),"--revision",rev]
              return subprocess.run([sys.executable,*args,"--article",aid],capture_output=True,text=True,encoding="utf-8")
          def denied(p,reason):return p.returncode==65 and not p.stdout and json.loads(p.stderr)["reason"]==reason
          def aid(n):return f"2918:normal:{n}"
          for rev in list(paths)[:-1]:
              test(rev+"_m2_m47_quarantine",all(denied(call(rev,aid(n),g),"REVISION_ARTICLE_QUARANTINED") for n in (2,47) for g in (False,True)))
          for n,coords,title in [(2,[(1,o) for o in range(19,28)]+[(2,0),(2,1)],"Kapsam:"),(47,[(39,o) for o in range(21,37)]+[(40,o) for o in range(32)],"Trafik işaret ve kurallarına uyma zorunluluğu:42")]:
              q=call("TUR059",aid(n));v=json.loads(q.stdout)
              test(f"m{n}_exact_new_body_title",q.returncode==0 and [(x["page"],x["ordinal"]) for x in v["body"]]==coords and v["annotations"][0]["text"]==title and v["evidence"]["artifact"]==15137949379 and not v["promotion_allowed"])
              q=call("TUR059",aid(n),True)
              test(f"m{n}_generic_exact_match",q.returncode==0 and json.loads(q.stdout)["body"]==v["body"] and json.loads(q.stdout)["annotations"]==v["annotations"])
          q=call("TUR059",aid(47));v=json.loads(q.stdout)
          test("m47_note42_exact",[(x["page"],x["ordinal"]) for x in v["annotations"] if x["type"]=="FOOTNOTE"]==[(39,37),(39,38)])
          q=call("TUR059",aid(48));v=json.loads(q.stdout)
          test("m48_note_43_44_45_exact",[(x["page"],x["ordinal"]) for x in v["annotations"] if x["type"]=="FOOTNOTE"]==[(41,o) for o in range(35,40)]+[(42,36),(42,37)])
          prior=[aid(n) for n in (3,45,4,46,28,29,49)]+["2918:geçici:27"]
          for a in prior:
              old=call("TUR058",a);new=call("TUR059",a);generic=call("TUR059",a,True)
              test(a+"_prior_exact_body_and_annotations_preserved",old.returncode==new.returncode==generic.returncode==0 and all(json.loads(old.stdout)[k]==json.loads(new.stdout)[k]==json.loads(generic.stdout)[k] for k in ("body","annotations","status","promotion_allowed")))
          test("cross_revision_hash_rejected",denied(call("TUR059",aid(2),path=paths["TUR058"]),"HASH_MISMATCH"))
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/"tamper.sqlite";shutil.copyfile(paths["TUR059"],p)
              db=sqlite3.connect(p);db.execute("UPDATE reader_line SET body='synthetic changed text' WHERE article_id=? AND page=1 AND ordinal=19",(aid(2),));db.commit();db.close()
              test("self_hash_tampered_snapshot_denied",all(denied(call("TUR059",a,True,path=p),"REVISION_ARTICLE_QUARANTINED") for a in prior+[aid(2),aid(47)]) and denied(call("TUR059",aid(2),path=p),"HASH_MISMATCH"))
          test("all_eleven_original_bytes_unchanged",before=={k:sha(p) for k,p in paths.items()})
          out={"status":"PINNED_AUDIT_READER_ONLY","promotion_allowed":False,"production":"NO-GO","official_legal_source":"NOT_VERIFIED","physical_uat":"NOT_RUN","checks":checks,"input_hashes":before,"wrapper_sha256":sha(pathlib.Path("tools/audit_pinned_reader.py")),"generic_reader_sha256":sha(pathlib.Path("tools/audit_candidate_reader.py")),"limitations":["current reader only; historical source and direct SQLite remain available","no general freshness or digital signature","no Windows product integration"]}
          (r/"result.json").write_text(json.dumps(out,indent=2),encoding="utf-8");print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR059-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur059-pin-evidence/
          if-no-files-found: error
