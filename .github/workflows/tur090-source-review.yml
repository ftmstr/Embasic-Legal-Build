name: TUR090 source repair candidate NOT RELEASE
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur090-source-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15022263838'
          run-id: '45618167694'
          github-token: ${{ github.token }}
          path: source44
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15270172203'
          run-id: '46161909023'
          github-token: ${{ github.token }}
          path: prior89
      - name: Source reconciliation and SQLite repair
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          cat > /tmp/tur090_repair.py <<'PY'
          import pathlib as P,hashlib as H,json as J,sqlite3 as S,shutil,subprocess,unicodedata as U,sys
          base,pdf,out=map(P.Path,sys.argv[1:4]);out.mkdir(exist_ok=True,parents=True)
          sha=lambda p:H.sha256(p.read_bytes()).hexdigest();hs=lambda s:H.sha256(s.encode()).hexdigest();norm=lambda s:''.join(U.normalize('NFC',s).split())
          checks=[]
          def ck(n,v):
              assert v,n
              assert n not in {c['case'] for c in checks},n
              checks.append({'case':n,'pass':True})
          inputs={n:sha(base/n) for n in ('grammar-repaired.sqlite','reader-candidate.sqlite')}
          ck('pdf_exact',sha(pdf)=='e66404cf48ef79bf83bb425df04f98f4063a77fbdee99bcdf4a1d8f2f905f35d')
          ck('grammar_exact',inputs['grammar-repaired.sqlite']=='2a8c2872e8023d697d767488614a462c0a0cef8814441f3157254e342aeffb9a')
          ck('reader_exact',inputs['reader-candidate.sqlite']=='d1aefc49299e45791a9892f41898ef3c8e8e6e0a8165b3ec6983e7683848cf25')
          for n in inputs:shutil.copyfile(base/n,out/n)
          oldjson={}
          for f in sorted(base.glob('*.json')):
              n='tur089-'+f.name if f.name in ('boundary-review.json','result.json') else f.name
              assert not (out/n).exists();shutil.copyfile(f,out/n);oldjson[n]=sha(f)
          ck('42_previous_json',len(oldjson)==42)
          g=S.connect(out/'grammar-repaired.sqlite');r=S.connect(out/'reader-candidate.sqlite');g.execute('pragma foreign_keys=on');r.execute('pragma foreign_keys=on')
          pages={p:norm(subprocess.check_output(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-']).decode()) for p in (2,4,5)}
          source=lambda p,o:g.execute('select raw,body,classification,spans from line where law=1632 and page=? and ordinal=?',(p,o)).fetchone()
          coords=[(2,o) for o in [3,4,5,6,7,8,9,10,11,31,32,33]]+[(4,o) for o in range(25,34)]+[(5,o) for o in list(range(12))+[29]]
          for p,o in coords:ck(f'pdf_line_{p}_{o}',norm(source(p,o)[0]) in pages[p])
          a3,a17,a19=[f'1632:normal:{n}' for n in (3,17,19)]
          mem=lambda a:g.execute('select page,ordinal,body from membership where article_id=? order by page,ordinal',(a,)).fetchall()
          ck('m17_membership',[(p,o) for p,o,b in mem(a17)]==[(4,o) for o in range(26,34)]+[(5,0),(5,1)])
          ck('m17_amendment','2862/1' in mem(a17)[2][2]);ck('m17_superscript_excluded',mem(a17)[-1][2]=='müracaat olunamaz.' and source(5,1)[0].endswith('.5'))
          ck('m17_superscript5',any(s['text']=='5' and s['size']<10 for s in J.loads(source(5,1)[3])))
          ck('m17_footnote5',source(5,29)[2]=='FOOTNOTE_CANDIDATE' and source(5,29)[0].startswith('5 Adli amirlik') and not g.execute('select 1 from membership where law=1632 and page=5 and ordinal=29').fetchone())
          ck('m18_boundary',g.execute('select article_id from membership where law=1632 and page=5 and ordinal=3').fetchone()==('1632:normal:18',))
          ck('m19_original_membership',[(p,o) for p,o,b in mem(a19)]==[(5,o) for o in range(5,11)])
          ck('m19_repeal',mem(a19)[0][2]=='(Mülga: 31/1/2013-6413/45 md.)')
          ck('m19_structural_text',[source(5,o)[0] for o in range(6,11)]==['İKİNCİ BAP','Cezalar','Umumi hükümler','BİRİNCİ FASIL','Askeri cezalar'])
          ck('m20_boundary',g.execute('select article_id from membership where law=1632 and page=5 and ordinal=12').fetchone()==('1632:normal:20',))
          ck('m3_superscript3',any(s['text']=='3' and s['size']<10 for s in J.loads(source(2,3)[3])))
          ck('m3_footnote3',source(2,31)[0].startswith('3 10/3/2011') and all(source(2,o)[2]=='FOOTNOTE_CANDIDATE' for o in (31,32,33)))
          ck('m3_missing_annotation',not r.execute('select 1 from reader_annotation where article_id=?',(a3,)).fetchone() and not g.execute('select 1 from source_boundary_repair where law=1632 and page=2 and ordinal in (3,31,32,33)').fetchone())
          ck('m3_source_outside_membership',not g.execute('select 1 from membership where law=1632 and page=2 and ordinal in (3,31,32,33)').fetchone())
          ck('m3_body',[(p,o) for p,o,b in mem(a3)]==[(2,o) for o in range(4,11)])
          ck('m3_prior_candidate',r.execute('select status from article_index where id=?',(a3,)).fetchone()==('CANDIDATE_UNVERIFIED',))
          removed=r.execute('select * from reader_line where article_id=? order by page,ordinal',(a3,)).fetchall();ck('m3_reader_seven',removed==[(a3,1632,p,o,b) for p,o,b in mem(a3)])
          for a in (a17,a19):ck(a+'_prior_withheld',r.execute('select status from article_index where id=?',(a,)).fetchone()==('WITHHELD_REVIEW',) and not r.execute('select 1 from reader_line where article_id=?',(a,)).fetchone() and not r.execute('select 1 from reader_annotation where article_id=?',(a,)).fetchone())
          g.execute('delete from membership where article_id=? and page=5 and ordinal between 6 and 10',(a19,))
          roles=[]
          for a,p,o,k in [(a17,4,25,'TITLE'),(a17,5,29,'FOOTNOTE'),(a19,5,4,'TITLE'),(None,5,6,'BAP_HEADING'),(None,5,7,'BAP_HEADING'),(None,5,8,'SECTION_HEADING'),(None,5,9,'CHAPTER_HEADING'),(None,5,10,'CHAPTER_HEADING')]:
              raw=source(p,o)[0];ck(f'role_free_{p}_{o}',not g.execute('select 1 from membership where law=1632 and page=? and ordinal=?',(p,o)).fetchone() and not g.execute('select 1 from source_boundary_repair where law=1632 and page=? and ordinal=?',(p,o)).fetchone());g.execute('insert into source_boundary_repair values(?,?,?,?,?,?)',(1632,p,o,a,k,hs(raw)));roles.append([a,p,o,k,raw,hs(raw)])
          restored={}
          for a,count in [(a17,10),(a19,1)]:
              rows=mem(a);ck(a+'_body_count',len(rows)==count and all(not b.startswith('Madde '+a.split(':')[-1]+' ') for p,o,b in rows));r.execute('update article_index set status=?,reason=? where id=?',('CANDIDATE_UNVERIFIED','SOURCE_BOUNDARY_REVIEW_ONLY',a));r.executemany('insert into reader_line values(?,?,?,?,?)',[(a,1632,p,o,b) for p,o,b in rows]);restored[a]=rows
          for a,p,o,k,raw,h in roles:
              if a:r.execute('insert into reader_annotation values(?,?,?,?,?,?)',(a,k,p,o,raw,h))
          r.execute('update article_index set status=?,reason=? where id=?',('WITHHELD_REVIEW','TUR090_MISSING_TITLE_AND_FOOTNOTE3',a3));r.execute('delete from reader_line where article_id=?',(a3,));r.execute("update metadata set value='TUR090' where key='projection_revision'");g.commit();r.commit()
          diffs={}
          for db,fn,expect in [(g,'grammar-repaired.sqlite',{'membership':(0,5),'source_boundary_repair':(8,0)}),(r,'reader-candidate.sqlite',{'article_index':(3,3),'reader_line':(11,7),'reader_annotation':(3,0),'metadata':(1,1)})]:
              ck(fn+'_integrity',db.execute('pragma integrity_check').fetchone()==('ok',) and not db.execute('pragma foreign_key_check').fetchall());db.execute('attach database ? as prior',(str(base/fn),));diff={}
              for (t,) in db.execute("select name from main.sqlite_master where type='table'").fetchall():
                  d=tuple(db.execute(f'select count(*) from (select * from {a}."{t}" except select * from {b}."{t}")').fetchone()[0] for a,b in [('main','prior'),('prior','main')]);ck(fn+'_'+t+'_except',d==expect.get(t,(0,0)));diff[t]=d
              diffs[fn]=diff;db.execute('detach database prior')
          ck('counts',r.execute("select count(*) from article_index where status='CANDIDATE_UNVERIFIED'").fetchone()==(1474,) and r.execute("select count(*) from article_index where status='WITHHELD_REVIEW'").fetchone()==(34,) and r.execute('select count(*) from reader_line').fetchone()==(18088,) and r.execute('select count(*) from reader_annotation').fetchone()==(224,) and g.execute('select count(*) from source_boundary_repair').fetchone()==(170,))
          ck('structural_outside_membership',not g.execute('select 1 from membership join source_boundary_repair using(law,page,ordinal) where source_boundary_repair.article_id is null').fetchone())
          ck('annex_exclusion',g.execute("select count(*) from line where law=1632 and classification='ANNEX_REVIEW'").fetchone()==(219,) and not g.execute("select 1 from membership join line using(law,page,ordinal) where law=1632 and classification='ANNEX_REVIEW'").fetchone())
          ck('prior_json_exact',all(sha(out/n)==h for n,h in oldjson.items()));ck('inputs_unchanged',all(sha(base/n)==h for n,h in inputs.items()))
          review={'restored':restored,'roles':roles,'m17_footnote5':{'anchor':[5,1],'row':[5,29],'reference':'LAW_TITLE_FOOTNOTE_1','amendment':[4,28]},'m19_repeal':[5,5],'structural_membership_removed':[[5,o] for o in range(6,11)],'m3_new_hold':{'title_anchor':[2,3],'footnote_rows':[[2,o] for o in (31,32,33)],'removed_reader_rows':removed,'status':'WITHHELD_REVIEW'},'sql_except':diffs,'prior_json_sha256':oldjson,'legal_paragraph_number':None,'automatic_effect':False,'legacy_nodes_authoritative':False,'status':'REVIEW_REQUIRED','promotion_allowed':False}
          (out/'boundary-review.json').write_text(J.dumps(review,ensure_ascii=False,indent=2));res={'checks':checks,'status':'TUR090_CANDIDATE_ONLY','promotion_allowed':False,'production':'NO-GO','reader_sha256':sha(out/'reader-candidate.sqlite'),'grammar_sha256':sha(out/'grammar-repaired.sqlite'),'new_snapshot_pinned':False};(out/'result.json').write_text(J.dumps(res,ensure_ascii=False,indent=2));print(len(checks),res['reader_sha256'],res['grammar_sha256'])
          PY
          python /tmp/tur090_repair.py "$(dirname "$(find prior89 -name grammar-repaired.sqlite -print -quit)")" "$(find source44 -name u15.pdf -print -quit)" tur090-evidence
          python - <<'PY'
          import sys,pathlib as P,hashlib as H,json as J
          sys.path.insert(0,'tools')
          import audit_candidate_reader as cr
          sha=lambda p:H.sha256(p.read_bytes()).hexdigest()
          out=P.Path('tur090-evidence');p=out/'reader-candidate.sqlite'
          r=J.loads((out/'result.json').read_bytes())
          for file,nums in [(next(P.Path('prior89').rglob('reader-candidate.sqlite')),[3]),(p,[3,17,19])]:
              db=cr.snapshot(file,sha(file))
              for n in nums:
                  try:cr.read_article(db,f'1632:normal:{n}');raise AssertionError(n)
                  except cr.Denied as e:assert str(e)=='REVISION_ARTICLE_QUARANTINED'
                  r['checks'].append({'case':f'{file.parent.name}_{n}_hold','pass':True})
              db.close()
          assert len({x['case'] for x in r['checks']})==len(r['checks'])
          (out/'result.json').write_text(J.dumps(r,ensure_ascii=False,indent=2))
          print('PASS',len(r['checks']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR090-Candidate-NOT-RELEASE
          path: tur090-evidence/
          if-no-files-found: error
