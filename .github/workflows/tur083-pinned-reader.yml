          test('m139_145_historical_policy',all(denied(call(rev,aid,g),'REVISION_ARTICLE_QUARANTINED') for rev in paths if int(rev[3:])<=76 for aid in repaired77 for g in (False,True)))
          test('m148_149_historical_policy',all(denied(call(rev,aid,g),'REVISION_ARTICLE_QUARANTINED') for rev in paths if int(rev[3:])<=77 for aid in repaired78 for g in (False,True)))
          test('m153_159_historical_policy',all(denied(call(rev,aid,g),'REVISION_ARTICLE_QUARANTINED') for rev in paths if int(rev[3:])<=78 for aid in repaired79 for g in (False,True)))
          test('m160_170_historical_policy',all(denied(call(rev,aid,g),'REVISION_ARTICLE_QUARANTINED') for rev in paths if int(rev[3:])<=79 for aid in repaired80 for g in (False,True)))
          test('m172_174_historical_policy',all(denied(call(rev,aid,g),'REVISION_ARTICLE_QUARANTINED') for rev in paths if int(rev[3:])<=80 for aid in repaired81 for g in (False,True)))
          test('m181_190_historical_policy',all(denied(call(rev,aid,g),'REVISION_ARTICLE_QUARANTINED') for rev in paths if int(rev[3:])<=81 for aid in repaired82 for g in (False,True)))
          for rev in paths:
              test(rev+'_two_unconditional_holds',all(denied(call(rev,aid,g),'REVISION_ARTICLE_QUARANTINED') for aid in holds for g in (False,True)))
          repair=next(P.Path('prior83').rglob('grammar-repaired.sqlite'))
          test('exact_grammar_artifact',sha(repair)=='72c88dd196d8ed17393cb33e7a20d19c2a2676f158d9b8145e2643ae9e6e6c87')
          with S.connect(repair.resolve().as_uri()+'?mode=ro',uri=True) as gd:
              test('six_number_four_letter_overlay',gd.execute("select count(*) from grammar_overlay where law=1632 and parent_id=?",(a(95),)).fetchone()==(6,) and gd.execute("select count(*) from grammar_overlay where law=1632 and parent_id=?",(a(95)+'/legacy-p@27:23',)).fetchone()==(4,))
          prior95=next(P.Path('prior83').rglob('tur069-boundary-review.json'))
          original95=next(P.Path('prior69').rglob('boundary-review.json'))
          m95=J.loads(prior95.read_bytes())
          test('literal_partition_and_references',sha(prior95)==sha(original95) and m95['legacy_nodes_authoritative'] is False and m95['records']['95']['legal_paragraph_number'] is None and len(m95['records']['95']['literal_markers'])==10 and len(m95['records']['95']['references'])==3 and len(m95['records']['95']['overlay_additions'])==9)
          test('new_literal_coordinates',delta['legacy_nodes_authoritative'] is False and all(delta['records'][aid]['legal_paragraph_number'] is None for aid in new) and len(delta['new_overlays'])==7 and all(x[3] is None for x in delta['new_overlays']) and [x[4] for x in delta['new_nodes']]==['A)','B)','A)','B)','A)','B)','C)'])
