name: TUR063 nested definition pinned reader (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur063-pinned-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15057816038'
          run-id: '45687953803'
          github-token: ${{ github.token }}
          path: prior49
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15056664563'
          run-id: '45688754638'
          github-token: ${{ github.token }}
          path: prior50
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15058496001'
          run-id: '45689770047'
          github-token: ${{ github.token }}
          path: prior51
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060085952'
          run-id: '45693327586'
          github-token: ${{ github.token }}
          path: prior52
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060641088'
          run-id: '45694684288'
          github-token: ${{ github.token }}
          path: prior53
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060707849'
          run-id: '45696360940'
          github-token: ${{ github.token }}
          path: prior54
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15064090183'
          run-id: '45700585363'
          github-token: ${{ github.token }}
          path: prior55
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093086567'
          run-id: '45768293248'
          github-token: ${{ github.token }}
          path: prior56
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093895209'
          run-id: '45769614123'
          github-token: ${{ github.token }}
          path: prior57
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15124392385'
          run-id: '45834946840'
          github-token: ${{ github.token }}
          path: prior58
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15137949379'
          run-id: '45862843182'
          github-token: ${{ github.token }}
          path: prior59
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15144913108'
          run-id: '45876381548'
          github-token: ${{ github.token }}
          path: prior60
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15156381649'
          run-id: '45901669617'
          github-token: ${{ github.token }}
          path: prior61
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15191499573'
          run-id: '45987493698'
          github-token: ${{ github.token }}
          path: prior62
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15220742803'
          run-id: '46043316831'
          github-token: ${{ github.token }}
          path: prior63
      - name: Verify exact nested definition access and historical policies
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess,sys,sqlite3,tempfile,shutil
          paths={f"TUR{i:03d}":next(pathlib.Path(f"prior{i}").rglob("reader-candidate.sqlite")) for i in range(49,64)}
          r=pathlib.Path("tur063-pin-evidence");r.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={k:sha(p) for k,p in paths.items()}
          checks=[]
          def test(n,v):
              assert v,n
              checks.append({"case":n,"pass":True})
          def call(rev,aid,generic=False,path=None):
              p=path or paths[rev]
              args=["tools/audit_candidate_reader.py","--db",str(p),"--expected-sha256",sha(p)] if generic else ["tools/audit_pinned_reader.py","--db",str(p),"--revision",rev]
              return subprocess.run([sys.executable,*args,"--article",aid],capture_output=True,text=True,encoding="utf-8")
          def denied(p,reason):return p.returncode==65 and not p.stdout and json.loads(p.stderr)["reason"]==reason
          m="2863:normal:3"
          def a(n):return f"2918:normal:{n}"
          def e(n):return f"2918:ek:{n}"
          def g(n):return f"2918:geçici:{n}"
          for rev in list(paths)[:-1]:
              test(rev+"_2863_m3_hold",all(denied(call(rev,m,generic),"REVISION_ARTICLE_QUARANTINED") for generic in (False,True)))
          q=call("TUR063",m);v=json.loads(q.stdout)
          coords=[(1,o) for o in range(21,31)]+[(2,o) for o in range(38)]+[(3,o) for o in range(34)]
          test("m3_exact_body_identity",q.returncode==0 and v["id"]==m and v["kind"]=="normal" and [(x["page"],x["ordinal"]) for x in v["body"]]==coords and v["evidence"]["artifact"]==15220742803 and not v["promotion_allowed"])
          test("m3_exact_title_and_note3",[(x["type"],x["page"],x["ordinal"]) for x in v["annotations"]]==[("TITLE",1,20)]+[("FOOTNOTE",2,o) for o in range(38,41)] and v["annotations"][0]["text"]=="Tanımlar ve kısaltmalar:" and v["annotations"][1]["text"].startswith("3 "))
          q=call("TUR063",m,True)
          test("m3_generic_exact_match",q.returncode==0 and all(json.loads(q.stdout)[k]==v[k] for k in ("body","annotations","status","promotion_allowed")))
          for n,title in [(1,"Amaç:"),(2,"Kapsam:"),(4,"Haber verme zorunluğu:")]:
              aid=f"2863:normal:{n}"
              old=call("TUR062",aid);new=call("TUR063",aid)
              test(aid+"_neighbor_body_preserved",old.returncode==new.returncode==0 and json.loads(old.stdout)["body"]==json.loads(new.stdout)["body"] and len(json.loads(new.stdout)["annotations"])==1 and json.loads(new.stdout)["annotations"][0]["text"]==title)
          prior=[a(n) for n in (65,2,47,3,45,4,46,28,29,49)]+[e(2),g(27),g(1),g(2),g(3),e(19),e(20)]
          for aid in prior:
              old=call("TUR062",aid);new=call("TUR063",aid);generic=call("TUR063",aid,True)
              test(aid+"_prior_exact_preserved",old.returncode==new.returncode==generic.returncode==0 and all(json.loads(old.stdout)[k]==json.loads(new.stdout)[k]==json.loads(generic.stdout)[k] for k in ("body","annotations","status","promotion_allowed")))
          test("ek19_ek20_historical_policy",all(denied(call(f"TUR{i:03d}",e(n),generic),"REVISION_ARTICLE_QUARANTINED") for i in range(49,62) for n in (19,20) for generic in (False,True)))
          test("g123_historical_policy",all(denied(call(f"TUR{i:03d}",g(n),generic),"REVISION_ARTICLE_QUARANTINED") for i in range(49,61) for n in (1,2,3) for generic in (False,True)))
          test("cross_revision_hash_rejected",denied(call("TUR063",m,path=paths["TUR062"]),"HASH_MISMATCH"))
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/"tamper.sqlite";shutil.copyfile(paths["TUR063"],p)
              db=sqlite3.connect(p);db.execute("UPDATE reader_line SET body='synthetic changed text' WHERE article_id=? AND page=1 AND ordinal=21",(m,));db.commit();db.close()
              test("self_hash_tampered_snapshot_denied",all(denied(call("TUR063",aid,True,path=p),"REVISION_ARTICLE_QUARANTINED") for aid in prior+[m]) and denied(call("TUR063",m,path=p),"HASH_MISMATCH"))
          test("all_fifteen_original_bytes_unchanged",before=={k:sha(p) for k,p in paths.items()})
          out={"status":"PINNED_AUDIT_READER_ONLY","promotion_allowed":False,"production":"NO-GO","official_legal_source":"NOT_VERIFIED","physical_uat":"NOT_RUN","checks":checks,"input_hashes":before,"wrapper_sha256":sha(pathlib.Path("tools/audit_pinned_reader.py")),"generic_reader_sha256":sha(pathlib.Path("tools/audit_candidate_reader.py")),"limitations":["current reader only; historical source and direct SQLite remain available","no general freshness or digital signature","no Windows product integration"]}
          (r/"result.json").write_text(json.dumps(out,indent=2),encoding="utf-8");print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR063-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur063-pin-evidence/
          if-no-files-found: error
