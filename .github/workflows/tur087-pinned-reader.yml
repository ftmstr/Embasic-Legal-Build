          run-id: '46158238500'
          github-token: ${{ github.token }}
          path: prior86
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15269205908'
          run-id: '46158676390'
          github-token: ${{ github.token }}
          path: prior87
      - name: Verify historical policy, 92 exact accesses and 39 holds
        run: |
          python3 - <<'PY'
          import pathlib as P,hashlib as H,json as J,subprocess,sys,sqlite3 as S,tempfile,shutil,ast,types
          sha=lambda p:H.sha256(p.read_bytes()).hexdigest()
          sys.path.insert(0,'tools')
          import audit_candidate_reader as cr,audit_pinned_reader as pr
          oldsrc=subprocess.check_output(['git','show','35f8a99a653883c77293a266a624585c86efb995:tools/audit_candidate_reader.py']).decode()
          old=types.ModuleType('old_reader');exec(compile(oldsrc,'old_reader.py','exec'),old.__dict__)
          def mapping(source,mod):
              f=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name=='read_article')
              d=next(n.value.func.value for n in f.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='pins' for t in n.targets))
              return {k.value:getattr(mod,v.id) if isinstance(v,ast.Name) else ast.literal_eval(v) for k,v in zip(d.keys,d.values)}
          oldmap=mapping(oldsrc,old)
          newmap=mapping(P.Path('tools/audit_candidate_reader.py').read_text(),cr)
          holds={f'1632:normal:{n}' for n in [1,7,8,13,15,20,23,24,25,28,29,30,31,32,40,41,42,43,46,47,48,49,51,52,56,60,61,62,63,64,67,68,69,70,72,75,78,79,81]}
          m104='1632:normal:104';newhash='9d5e5340b91ad00a2b76f2f9bcc377af11019638dfff2203f919a3d69fbbd601'
          checks=[]
          def ck(n,v):
              assert v,n
              checks.append({'case':n,'pass':True})
          ck('map_scope',len(oldmap)==91 and len(newmap)==131 and set(newmap)==set(oldmap)|holds|{m104})
          ck('old_maps_exactly_preserved',all(newmap[a]==dict(oldmap[a],TUR087=newhash) for a in oldmap))
          ck('new_map_policy',newmap[m104]=={'TUR087':newhash} and all(newmap[a]=={} for a in holds))
          paths={f'TUR{i:03d}':next(P.Path(f'prior{i}').rglob('reader-candidate.sqlite')) for i in list(range(49,64))+[66,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87]}
          before={k:sha(v) for k,v in paths.items()}
          ck('all_36_pins_and_unpinned_86',len(paths)==37 and set(pr.PINS)==set(paths)-{'TUR086'} and all(pr.PINS[k]['sha256']==before[k] for k in pr.PINS) and before['TUR086']=='b049a7779f99dcd74269da48203e916b46e1423b39f88c96daedde88b85b0678')
          oldpins=types.ModuleType('old_pins');exec(compile(subprocess.check_output(['git','show','35f8a99a653883c77293a266a624585c86efb995:tools/audit_pinned_reader.py']),'old_pins.py','exec'),oldpins.__dict__)
          ck('wrapper_historical_pins_unchanged',len(oldpins.PINS)==35 and all(pr.PINS[k]==v for k,v in oldpins.PINS.items()))
          def get(mod,db,a):
              try:return ('OK',mod.read_article(db,a))
              except mod.Denied as e:return ('DENY',str(e))
          deny=('DENY','REVISION_ARTICLE_QUARANTINED')
          base85=cr.snapshot(paths['TUR085'],before['TUR085'])
          for rev in oldpins.PINS:
              db=cr.snapshot(paths[rev],before[rev]);odb=old.snapshot(paths[rev],before[rev])
              for a in oldmap:
                  x=get(old,odb,a);y=get(cr,db,a)
                  ck(rev+'_'+a+'_historical_exact',x==y and (x[0]=='OK' if oldmap[a].get(rev)==before[rev] else x==deny))
              for a in sorted(holds|{m104}):ck(rev+'_'+a+'_historical_hold',get(cr,db,a)==deny)
              db.close();odb.close()
          db86=cr.snapshot(paths['TUR086'],before['TUR086'])
          ck('TUR086_all131_unpinned',all(get(cr,db86,a)==deny for a in newmap));db86.close()
          db=cr.snapshot(paths['TUR087'],before['TUR087'])
          for a in oldmap:ck(a+'_new_exact',get(cr,db,a)==get(cr,base85,a) and get(cr,db,a)[0]=='OK')
          base85.close()
          delta=J.loads(next(P.Path('prior87').rglob('boundary-review.json')).read_bytes())
          v=get(cr,db,m104);ck('m104_full_exact',v[0]=='OK' and [(x['page'],x['ordinal'],x['text']) for x in v[1]['body']]==[tuple(x[2:]) for x in delta['body_rows']] and [(x['type'],x['page'],x['ordinal'],x['text'],x['source_text_sha256']) for x in v[1]['annotations']]==[tuple(x[1:]) for x in delta['annotations']] and not v[1]['promotion_allowed'])
          ck('39_new_holds',all(get(cr,db,a)==deny for a in holds));db.close()
          for a in sorted(set(oldmap)|{m104}):
              q=subprocess.run([sys.executable,'tools/audit_pinned_reader.py','--db',str(paths['TUR087']),'--revision','TUR087','--article',a],capture_output=True,text=True)
              ck(a+'_wrapper_exact',q.returncode==0 and J.loads(q.stdout)['evidence']['artifact']==15269205908 and J.loads(q.stdout)['promotion_allowed'] is False)
          for a in sorted(holds):
              q=subprocess.run([sys.executable,'tools/audit_pinned_reader.py','--db',str(paths['TUR087']),'--revision','TUR087','--article',a],capture_output=True,text=True)
              ck(a+'_wrapper_hold',q.returncode==65 and not q.stdout and J.loads(q.stderr)['reason']==deny[1])
          with tempfile.TemporaryDirectory() as td:
              t=P.Path(td)/'forged.sqlite';shutil.copyfile(paths['TUR087'],t)
              d=S.connect(t);d.execute("update reader_line set body='synthetic tamper' where article_id=? and page=29 and ordinal=14",(m104,));d.executemany("update article_index set status='CANDIDATE_UNVERIFIED' where id=?",[(a,) for a in holds]);d.commit();d.close()
              forged=cr.snapshot(t,sha(t))
              for a in newmap:ck(a+'_self_hash_denied',get(cr,forged,a)==deny)
              forged.close()
              q=subprocess.run([sys.executable,'tools/audit_pinned_reader.py','--db',str(t),'--revision','TUR087','--article',m104],capture_output=True,text=True)
              ck('wrapper_tamper_hash_mismatch',q.returncode==65 and not q.stdout and J.loads(q.stderr)['reason']=='HASH_MISMATCH')
          ck('all37_input_bytes_unchanged',before=={k:sha(v) for k,v in paths.items()})
          ck('grammar_bytes_unchanged',sha(next(P.Path('prior87').rglob('grammar-repaired.sqlite')))=='f4652756a9d88e1199db11e10e45441eac9272b08ba4285c97610907648c4b9e')
          out=P.Path('tur087-pinned-evidence');out.mkdir()
          (out/'result.json').write_text(J.dumps({'checks':checks,'input_hashes':before,'status':'PINNED_AUDIT_READER_ONLY','production':'NO-GO','promotion_allowed':False,'generic_reader_sha256':sha(P.Path('tools/audit_candidate_reader.py')),'wrapper_sha256':sha(P.Path('tools/audit_pinned_reader.py'))},indent=2))
          print('PASS',len(checks),'historical snapshots 35; 92 exact; 39 holds; TUR086 unpinned')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR087-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur087-pinned-evidence/
          if-no-files-found: error
