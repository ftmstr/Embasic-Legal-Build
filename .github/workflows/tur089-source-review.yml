name: TUR089 source repair candidate NOT RELEASE
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur089-source-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15022263838'
          run-id: '45618167694'
          github-token: ${{ github.token }}
          path: source44
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15270206098'
          run-id: '46161293930'
          github-token: ${{ github.token }}
          path: prior88
      - name: Source reconciliation and SQLite repair
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          cat > /tmp/tur089_repair.py <<'PY'
          import pathlib as P,hashlib as H,json as J,sqlite3 as S,shutil,subprocess,unicodedata as U,sys,re
          base,pdf,out=map(P.Path,sys.argv[1:4]);out.mkdir(exist_ok=True,parents=True)
          sha=lambda p:H.sha256(p.read_bytes()).hexdigest();hs=lambda s:H.sha256(s.encode()).hexdigest();norm=lambda s:' '.join(U.normalize('NFC',s).split())
          checks=[]
          def ck(n,v):
           assert v,n
           assert n not in {x['case'] for x in checks},n
           checks.append({'case':n,'pass':True})
          inputs={n:sha(base/n) for n in ['grammar-repaired.sqlite','reader-candidate.sqlite']}
          ck('pdf_exact',sha(pdf)=='e66404cf48ef79bf83bb425df04f98f4063a77fbdee99bcdf4a1d8f2f905f35d')
          ck('grammar_exact',inputs['grammar-repaired.sqlite']=='259ddce1702be4a0039ac5814a58746071588cd010aba7cbcaf7e05f98e5720c')
          ck('reader_exact',inputs['reader-candidate.sqlite']=='49c0dacda1c8c55e22ab9509da249ee11c5ec7a2884676a2072b05b574d40a50')
          for n in inputs:shutil.copyfile(base/n,out/n)
          oldjson={}
          for f in sorted(base.glob('*.json')):
           n='tur088-'+f.name if f.name in ('boundary-review.json','result.json') else f.name
           assert not (out/n).exists();shutil.copyfile(f,out/n);oldjson[n]=sha(f)
          ck('prior40_json',len(oldjson)==40)
          g=S.connect(out/'grammar-repaired.sqlite');r=S.connect(out/'reader-candidate.sqlite');g.execute('pragma foreign_keys=on');r.execute('pragma foreign_keys=on')
          pages={p:norm(subprocess.check_output(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-']).decode()) for p in (4,5)}
          source=lambda p,o:g.execute('select raw,body,classification,spans from line where law=1632 and page=? and ordinal=?',(p,o)).fetchone()
          def check_line(p,o):
           raw=source(p,o)[0];ck(f'pdf_line_{p}_{o}',norm(raw) in pages[p]);return raw
          id=lambda n:f'1632:normal:{n}'
          ids=[id(n) for n in (13,15,20)]
          roles=[];marks=[];restored={};removed={}
          for a,p,o in [(ids[0],4,0),(ids[1],4,14),(ids[2],5,11)]:
           raw=check_line(p,o);ck(a+'_title_free',source(p,o)[2]=='HEADING_CANDIDATE' and not g.execute('select 1 from membership where law=1632 and page=? and ordinal=?',(p,o)).fetchone() and not g.execute('select 1 from source_boundary_repair where law=1632 and page=? and ordinal=?',(p,o)).fetchone());g.execute('insert into source_boundary_repair values(?,?,?,?,?,?)',(1632,p,o,a,'TITLE',hs(raw)));roles.append([a,p,o,'TITLE',raw,hs(raw)])
          for a,p,starts in [(ids[0],4,[(2,'1 -'),(4,'2 -'),(5,'3 -'),(6,'4 -')]),(ids[1],4,[(15,'1 -'),(18,'2 -'),(20,'3 -')]),(ids[2],5,[(12,'1-'),(15,'2 -')])]:
           for o,k in starts:
            ck(f'literal_{p}_{o}',g.execute('select body from membership where article_id=? and page=? and ordinal=?',(a,p,o)).fetchone()[0].startswith(k) and not g.execute('select 1 from node where article_id=? and page=? and ordinal=?',(a,p,o)).fetchone() and not g.execute('select 1 from grammar_overlay where law=1632 and page=? and ordinal=?',(p,o)).fetchone());nid=f'{a}/literal@{p}:{o}';g.execute('insert into node values(?,?,?,?,?,?,?,?)',(nid,a,a,'literal_marker_candidate',k,p,o,'REVIEW_REQUIRED'));g.execute('insert into grammar_overlay values(?,?,?,?,?,?,?,?,?)',(1632,p,o,None,nid,a,'literal_marker_candidate','REVIEW_REQUIRED','TUR089 source-coordinate marker; no legal number'));marks.append([a,p,o,k])
          for a,p,lo,hi,nextid in [(ids[0],4,1,9,14),(ids[1],4,15,21,16),(ids[2],5,12,18,21)]:
           rows=g.execute('select page,ordinal,body from membership where article_id=? order by page,ordinal',(a,)).fetchall();ck(a+'_body_coordinates',[(x[0],x[1]) for x in rows]==[(p,o) for o in range(lo,hi+1)]);ck(a+'_next_boundary',source(p,hi+1)[2]=='HEADING_CANDIDATE' and g.execute('select article_id from membership where law=1632 and page=? and ordinal=?',(p,hi+2)).fetchone()==(id(nextid),))
           for pp,o,b in rows:check_line(pp,o);ck(f'{a}_{pp}_{o}_header_not_repeated',not b.startswith('Madde '+a.split(':')[-1]+' '))
           ck(a+'_prior_hold',r.execute('select status from article_index where id=?',(a,)).fetchone()==('WITHHELD_REVIEW',) and not r.execute('select 1 from reader_line where article_id=?',(a,)).fetchone());r.execute('update article_index set status=?,reason=? where id=?',('CANDIDATE_UNVERIFIED','SOURCE_BOUNDARY_REVIEW_ONLY',a));r.executemany('insert into reader_line values(?,?,?,?,?)',[(a,1632,pp,o,b) for pp,o,b in rows]);restored[a]=rows
          ck('m13_amendment',restored[ids[0]][0][2]=='(Değişik: 15/6/1942-4257/1 md.)');ck('m13_reference12','12 nci maddede' in restored[ids[0]][1][2]);ck('m20_reference12','12 nci' in restored[ids[2]][4][2]);ck('m20_literal_spacing',marks[-2][-1]=='1-' and marks[-1][-1]=='2 -')
          for a,p,o,k,raw,h in roles:r.execute('insert into reader_annotation values(?,?,?,?,?,?)',(a,k,p,o,raw,h))
          # New confirmed defects: retain grammar/source unchanged for future full repair; withhold reader exposure.
          ck('m17_anchor5',any(s['text']=='5' and s['size']<10 for s in J.loads(source(5,1)[3])));ck('m17_anchor_source',norm(source(5,1)[0]).replace(' ','') in pages[5].replace(' ',''));ck('m17_footnote_source',norm(source(5,29)[0]).replace(' ','') in pages[5].replace(' ',''));ck('m17_footnote_unowned',source(5,29)[2]=='FOOTNOTE_CANDIDATE' and not g.execute('select 1 from source_boundary_repair where law=1632 and page=5 and ordinal=29').fetchone() and not r.execute('select 1 from reader_annotation where article_id=?',(id(17),)).fetchone())
          ck('m19_header',source(5,5)[2]=='ARTICLE_HEADER' and '(Mülga:' in source(5,5)[0]);
          for o,k in [(6,'İKİNCİ BAP'),(7,'Cezalar'),(8,'Umumi hükümler'),(9,'BİRİNCİ FASIL'),(10,'Askeri cezalar')]:
           ck(f'm19_leak_{o}',check_line(5,o)==k and g.execute('select article_id from membership where law=1632 and page=5 and ordinal=?',(o,)).fetchone()==(id(19),))
          for n,count,reason in [(17,10,'TUR089_MISSING_FOOTNOTE5'),(19,6,'TUR089_STRUCTURAL_HEADING_LEAK')]:
           a=id(n);rows=r.execute('select page,ordinal,body from reader_line where article_id=? order by page,ordinal',(a,)).fetchall();ck(a+'_prior_exposure',len(rows)==count and r.execute('select status from article_index where id=?',(a,)).fetchone()==('CANDIDATE_UNVERIFIED',) and not r.execute('select 1 from reader_annotation where article_id=?',(a,)).fetchone());removed[a]=rows;r.execute('update article_index set status=?,reason=? where id=?',('WITHHELD_REVIEW',reason,a));r.execute('delete from reader_line where article_id=?',(a,))
          r.execute("update metadata set value='TUR089' where key='projection_revision'");g.commit();r.commit()
          diffs={}
          for db,fn,expect in [(g,'grammar-repaired.sqlite',{'node':(9,0),'grammar_overlay':(9,0),'source_boundary_repair':(3,0)}),(r,'reader-candidate.sqlite',{'article_index':(5,5),'reader_line':(23,16),'reader_annotation':(3,0),'metadata':(1,1)})]:
           ck(fn+'_integrity',db.execute('pragma integrity_check').fetchone()==('ok',) and not db.execute('pragma foreign_key_check').fetchall());db.execute('attach database ? as prior',(str(base/fn),));diff={}
           for (t,) in db.execute("select name from main.sqlite_master where type='table'").fetchall():
            d=tuple(db.execute(f'select count(*) from (select * from {a}."{t}" except select * from {b}."{t}")').fetchone()[0] for a,b in [('main','prior'),('prior','main')]);ck(fn+'_'+t+'_except',d==expect.get(t,(0,0)));diff[t]=d
           diffs[fn]=diff;db.execute('detach database prior')
          ck('counts',r.execute("select count(*) from article_index where status='CANDIDATE_UNVERIFIED'").fetchone()==(1473,) and r.execute("select count(*) from article_index where status='WITHHELD_REVIEW'").fetchone()==(35,) and r.execute('select count(*) from reader_line').fetchone()==(18084,) and r.execute('select count(*) from reader_annotation').fetchone()==(221,) and g.execute('select count(*) from source_boundary_repair').fetchone()==(162,))
          ck('structural_footnotes_no_membership',not g.execute('select 1 from membership join source_boundary_repair using(law,page,ordinal) where role="STRUCTURAL_FOOTNOTE"').fetchone());ck('annex_exclusion',g.execute("select count(*) from line where law=1632 and classification='ANNEX_REVIEW'").fetchone()==(219,) and not g.execute("select 1 from membership join line using(law,page,ordinal) where law=1632 and classification='ANNEX_REVIEW'").fetchone());ck('prior_json_exact',all(sha(out/n)==h for n,h in oldjson.items()));ck('inputs_unchanged',all(sha(base/n)==h for n,h in inputs.items()))
          review={'restored':restored,'literal_markers':marks,'roles':roles,'new_holds':removed,'m17_footnote5':{'anchor':[5,1],'footnote':[5,29],'status':'REVIEW_REQUIRED'},'m19_structural_leak':[[5,o] for o in range(6,11)],'separate_common_intro_or_closing':False,'m13_amendment':[4,1],'sql_except':diffs,'prior_json_sha256':oldjson,'legal_paragraph_number':None,'automatic_effect':False,'legacy_nodes_authoritative':False,'status':'REVIEW_REQUIRED','promotion_allowed':False}
          (out/'boundary-review.json').write_text(J.dumps(review,ensure_ascii=False,indent=2));res={'checks':checks,'status':'TUR089_CANDIDATE_ONLY','promotion_allowed':False,'production':'NO-GO','reader_sha256':sha(out/'reader-candidate.sqlite'),'grammar_sha256':sha(out/'grammar-repaired.sqlite'),'new_snapshot_pinned':False};(out/'result.json').write_text(J.dumps(res,ensure_ascii=False,indent=2));print(len(checks),res['reader_sha256'],res['grammar_sha256'])
          PY
          python /tmp/tur089_repair.py "$(dirname "$(find prior88 -name grammar-repaired.sqlite -print -quit)")" "$(find source44 -name u15.pdf -print -quit)" tur089-evidence
          python - <<'PY'
          import sys,pathlib as P,hashlib as H,json as J
          sys.path.insert(0,'tools')
          import audit_candidate_reader as cr
          sha=lambda p:H.sha256(p.read_bytes()).hexdigest()
          out=P.Path('tur089-evidence');p=out/'reader-candidate.sqlite'
          r=J.loads((out/'result.json').read_bytes())
          for file,nums in [(next(P.Path('prior88').rglob('reader-candidate.sqlite')),[17,19]),(p,[13,15,17,19,20])]:
              db=cr.snapshot(file,sha(file))
              for n in nums:
                  try:cr.read_article(db,f'1632:normal:{n}');raise AssertionError(n)
                  except cr.Denied as e:assert str(e)=='REVISION_ARTICLE_QUARANTINED'
                  r['checks'].append({'case':f'{file.parent.name}_{n}_hold','pass':True})
              db.close()
          assert len({x['case'] for x in r['checks']})==len(r['checks'])
          (out/'result.json').write_text(J.dumps(r,ensure_ascii=False,indent=2))
          print('PASS',len(r['checks']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR089-Candidate-NOT-RELEASE
          path: tur089-evidence/
          if-no-files-found: error
