name: TUR070 m97 m101 m103 boundary snapshot (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur070-military-snapshot.yml']
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15022263838'
          run-id: '45618167694'
          github-token: ${{ github.token }}
          path: source44
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15226253510'
          run-id: '46056939459'
          github-token: ${{ github.token }}
          path: prior69
      - name: Install independent extractor
        run: sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends poppler-utils
      - name: Verify source and isolated reader repair
        run: |
          python3 - <<'PY'
          import pathlib as P,sqlite3 as S,hashlib as H,json as J,shutil,subprocess,unicodedata,re
          def sha(p):return H.sha256(p.read_bytes()).hexdigest()
          def file(d,n):return next(P.Path(d).rglob(n))
          def norm(t):return ' '.join(unicodedata.normalize('NFC',t).split())
          pdf=file('source44','u15.pdf');g=file('prior69','grammar-repaired.sqlite');base=file('prior69','reader-candidate.sqlite');prev=file('prior69','boundary-review.json')
          inputs=[pdf,g,base,prev];before=list(map(sha,inputs));checks=[]
          def test(n,v):
              assert v,n
              checks.append({'case':n,'pass':True})
          test('exact_inputs',before==['e66404cf48ef79bf83bb425df04f98f4063a77fbdee99bcdf4a1d8f2f905f35d','b24a42c8f0d8489eb7be65c97fb35b10713ec448982701fece048d672e32dff2','55fc5dfa76c763d5ccd9f31359b6d918865024603bb28627043b6e00dc587e22','324bfcd803c81e2a6c036fead38333e26018649d118e4cc84290dd3d9d651b29'])
          s=S.connect(g.resolve().as_uri()+'?mode=ro',uri=True);s.row_factory=S.Row
          def aid(n):return f'1632:normal:{n}'
          def line(p,o):return dict(s.execute('select * from line where law=1632 and page=? and ordinal=?',(p,o)).fetchone())
          def ev(x):return {'page':x['page'],'ordinal':x['ordinal'],'raw':x['raw'],'bbox':J.loads(x['bbox']),'source_text_sha256':H.sha256(x['raw'].encode()).hexdigest()}
          def members(n):return [dict(x) for x in s.execute('select m.*,l.raw,l.bbox,l.classification,l.spans from membership m join line l using(law,page,ordinal) where article_id=? order by page,ordinal',(aid(n),))]
          for p in (28,29):
              raw=[dict(x) for x in s.execute('select * from line where law=1632 and page=? order by ordinal',(p,))]
              test(f'p{p}_full_independent_text',len(raw)==33 and [x['ordinal'] for x in raw]==list(range(33)) and norm(subprocess.check_output(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-'],text=True))==norm(' '.join(x['raw'] for x in raw)))
              test(f'p{p}_no_footnote',not any(x['classification']=='FOOTNOTE_CANDIDATE' or any(z['flags']&1 and z['text'].strip().isdigit() for z in J.loads(x['spans'])) for x in raw))
          rows=[];anns=[];records={}
          specs=[(97,[(28,o) for o in range(11,18)],(28,10),[(28,11),(28,16)],[],[(28,12,'(M. 86, 90, 91)'),(28,17,'50 nci madde')]),(101,[(28,31),(28,32),(29,0),(29,1),(29,2)],(28,30),[(28,31),(29,2)],[(28,31)],[(28,31,'(M. 100)'),(29,2,'birinci fıkradaki')]),(103,[(29,o) for o in range(7,13)],(29,6),[(29,7),(29,10)],[],[(29,7,'(M. 97)'),(29,7,'(M.100)')])]
          for n,coords,titlepos,marks,amends,refs in specs:
              rs=members(n);title=line(*titlepos)
              test(f'm{n}_full_boundary',[(x['page'],x['ordinal']) for x in rs]==coords and title['classification']=='HEADING_CANDIDATE' and all(x['classification'] in ('ARTICLE_HEADER','BODY_CANDIDATE') for x in rs))
              test(f'm{n}_header_only_removed',all(x['body']==(x['raw'].split(' – ',1)[1].strip() if i==0 else x['raw'].strip()) for i,x in enumerate(rs)))
              actual=[(x['page'],x['ordinal'],re.match(r'^\d+\.',x['body']).group()) for x in rs if re.match(r'^\d+\.',x['body'])]
              test(f'm{n}_literal_markers',actual==[(p,o,str(i)+'.') for i,(p,o) in enumerate(marks,1)])
              nodes=[dict(x) for x in s.execute('select * from node where article_id=? order by page,ordinal',(aid(n),))]
              ov=[dict(x) for x in s.execute('select * from grammar_overlay where law=1632 and (parent_id=? or parent_id like ?) order by page,ordinal',(aid(n),aid(n)+'/%'))]
              test(f'm{n}_node_and_overlay_coordinates',[(x['page'],x['ordinal']) for x in nodes]==marks and [(x['page'],x['ordinal']) for x in ov]==marks and all(x['parent']==aid(n) for x in nodes) and all(x['parent_id']==aid(n) and x['kind']=='legacy_paragraph_candidate' and x['status']=='REVIEW_REQUIRED' for x in ov) and [x['id'] for x in nodes]==[x['old_id'] for x in ov])
              test(f'm{n}_amendment',[(x['page'],x['ordinal']) for x in rs if '(Değişik:' in x['raw']]==amends)
              test(f'm{n}_literal_cross_references',all((p,o) in coords and literal in line(p,o)['raw'] for p,o,literal in refs))
              rows.extend((aid(n),1632,x['page'],x['ordinal'],x['body']) for x in rs)
              anns.append((aid(n),'TITLE',*titlepos,title['raw'],H.sha256(title['raw'].encode()).hexdigest()))
              records[str(n)]={'title':ev(title),'body':[ev(x) for x in rs],'literal_markers':actual,'overlay':ov,'legacy_nodes':nodes,'amendments':amends,'literal_references':refs,'legal_paragraph_number':None}
          m95=J.loads(prev.read_bytes())
          test('m95_overlay_preserved',m95['legacy_nodes_authoritative'] is False and len(m95['records']['95']['overlay_additions'])==9 and len(m95['records']['95']['references'])==3 and len(m95['records']['95']['literal_markers'])==10 and s.execute('select count(*) from grammar_overlay where law=1632 and parent_id=?',(aid(95),)).fetchone()[0]==6 and s.execute('select count(*) from grammar_overlay where law=1632 and parent_id=?',(aid(95)+'/legacy-p@27:23',)).fetchone()[0]==4)
          out=P.Path('tur070-evidence');out.mkdir();dst=out/'reader-candidate.sqlite';shutil.copyfile(base,dst);shutil.copyfile(g,out/g.name)
          d=S.connect(dst);d.execute('pragma foreign_keys=ON');d.execute('attach database ? as old',(base.resolve().as_uri()+'?mode=ro',))
          def q(sql,args=()):return d.execute(sql,args).fetchall()
          for n in (96,98,100,102,104):
              test(f'neighbor_m{n}_exact_body',q('select page,ordinal,body from reader_line where article_id=? order by page,ordinal',(aid(n),))==[(x['page'],x['ordinal'],x['body']) for x in members(n)])
          test('baseline',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1494),('WITHHELD_REVIEW',14)] and q('select count(*) from reader_line')==[(18475,)] and q('select count(*) from reader_annotation')==[(119,)])
          targets=[aid(n) for n in (97,101,103)]
          for a in targets:
              assert q('select status from article_index where id=?',(a,))==[('WITHHELD_REVIEW',)]
              d.execute("update article_index set status='CANDIDATE_UNVERIFIED',reason='SOURCE_BOUNDARY_REVIEW_ONLY' where id=?",(a,))
          d.executemany('insert into reader_line values(?,?,?,?,?)',rows);d.executemany('insert into reader_annotation values(?,?,?,?,?,?)',anns);d.execute("update metadata set value='TUR070' where key='projection_revision'")
          def diff(t,rev=False):
              x,y=('old.','') if rev else ('','old.')
              return set(q(f'select * from {x}{t} except select * from {y}{t}'))
          test('only_three_index_changes',all({x[0] for x in diff('article_index',r)}==set(targets) for r in (False,True)) and {x[:6] for x in diff('article_index')}=={x[:6] for x in diff('article_index',True)})
          test('18_body_additions_only',len(rows)==18 and diff('reader_line')==set(rows) and not diff('reader_line',True))
          test('3_title_additions_only',len(anns)==3 and diff('reader_annotation')==set(anns) and not diff('reader_annotation',True))
          test('counts',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1497),('WITHHELD_REVIEW',11)] and q('select count(*) from reader_line')==[(18493,)] and q('select count(*) from reader_annotation')==[(122,)])
          test('no_leak',not q("select 1 from reader_line where article_id in (select id from article_index where status='WITHHELD_REVIEW')") and not q('select 1 from reader_line r join reader_annotation a on r.law=(select law from article_index where id=a.article_id) and r.page=a.page and r.ordinal=a.ordinal'))
          test('metadata_only_revision',diff('metadata')=={('projection_revision','TUR070')} and diff('metadata',True)=={('projection_revision','TUR069')})
          test('temporal_preserved',not diff('temporal_decision') and not diff('temporal_decision',True) and q('select count(*) from temporal_decision')==[(11,)] and all(not J.loads(x[0])['automatic_effect'] for x in q('select record from temporal_decision')))
          test('ktk_2863_preserved',all(q('select status,count(*) from article_index where law=? group by status',(law,))==[('CANDIDATE_UNVERIFIED',n)] for law,n in [(2918,187),(2863,98)]))
          for p in sorted(base.parent.glob('*.json')):
              if p.name!='result.json':shutil.copyfile(p,out/('tur069-boundary-review.json' if p.name=='boundary-review.json' else p.name))
          rv=J.loads((out/'review-only.json').read_bytes())
          test('all_previous_review_records_preserved',len(rv['overlay_review'])==119 and len(rv['list_review'])==19 and sum(len(x['members']) for x in rv['list_review'])==90 and len(J.loads((out/'tur058-boundary-review.json').read_bytes())['definition_anchors'])==90 and all(sha(p)==sha(out/('tur069-boundary-review.json' if p.name=='boundary-review.json' else p.name)) for p in base.parent.glob('*.json') if p.name!='result.json'))
          test('grammar_byte_identical',sha(out/g.name)==before[1])
          d.commit();test('integrity',q('pragma integrity_check')==[('ok',)] and not q('pragma foreign_key_check'));d.close();s.close()
          test('original_bytes_unchanged',before==list(map(sha,inputs)))
          (out/'boundary-review.json').write_text(J.dumps({'records':records,'body_rows':rows,'annotations':anns,'legacy_nodes_authoritative':False,'legal_acceptance':False,'promotion_allowed':False},ensure_ascii=False,indent=2),encoding='utf-8')
          result={'status':'TUR070_BOUNDARY_CANDIDATE_ONLY','promotion_allowed':False,'production':'NO-GO','reader_sha256':sha(dst),'grammar_sha256':sha(out/g.name),'inputs':before,'checks':checks,'candidate_articles':1497,'withheld_articles':11,'body_rows':18493,'annotations':122}
          (out/'result.json').write_text(J.dumps(result,indent=2),encoding='utf-8');print(J.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR070-Military-Snapshot-NOT-RELEASE
          path: tur070-evidence/
          if-no-files-found: error
