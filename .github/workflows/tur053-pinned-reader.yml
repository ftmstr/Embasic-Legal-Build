name: TUR053 pinned repeated clause and quarantine audit (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur053-pinned-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15057816038'
          run-id: '45687953803'
          github-token: ${{ github.token }}
          path: prior49
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15056664563'
          run-id: '45688754638'
          github-token: ${{ github.token }}
          path: prior50
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15058496001'
          run-id: '45689770047'
          github-token: ${{ github.token }}
          path: prior51
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060085952'
          run-id: '45693327586'
          github-token: ${{ github.token }}
          path: prior52
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060641088'
          run-id: '45694684288'
          github-token: ${{ github.token }}
          path: prior53
      - name: Test exact new pin, old chapter leak quarantine and metadata spoof denial
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess,sys,sqlite3,tempfile,shutil
          paths={f"TUR{i:03d}":next(pathlib.Path(f"prior{i}").rglob("reader-candidate.sqlite")) for i in range(49,54)}
          r=pathlib.Path("tur053-pin-evidence");r.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={k:sha(p) for k,p in paths.items()}
          checks=[]
          def test(n,v):
              if not v:raise RuntimeError(n)
              checks.append({"case":n,"pass":True})
          def call(rev,aid,generic=False,path=None):
              p=path or paths[rev]
              args=["tools/audit_candidate_reader.py","--db",str(p),"--expected-sha256",sha(p)] if generic else ["tools/audit_pinned_reader.py","--db",str(p),"--revision",rev]
              return subprocess.run([sys.executable,*args,"--article",aid],capture_output=True,text=True,encoding="utf-8")
          def denied(p,reason):return p.returncode==65 and not p.stdout and json.loads(p.stderr)["reason"]==reason
          a49="2918:normal:49";a51="2918:normal:51";g27="2918:geçici:27"
          for rev in ("TUR049","TUR050","TUR051","TUR052"):
              db=sqlite3.connect(paths[rev].resolve().as_uri()+"?mode=ro",uri=True)
              rows=db.execute("SELECT page,ordinal,body FROM reader_line WHERE article_id=? ORDER BY page,ordinal",(a49,)).fetchall();db.close()
              test(rev+"_original_chapter_leak",len(rows)==36 and rows[-2:]==[(43,32,"İKİNCİ BÖLÜM"),(43,33,"Hız Kuralları")])
              test(rev+"_chapter_quarantine_both_readers",all(denied(call(rev,a49,g),"REVISION_ARTICLE_QUARANTINED") for g in (False,True)))
          q=call("TUR053",a51);v=json.loads(q.stdout)
          test("new_pin_exact_52_lines",q.returncode==0 and len(v["body"])==52 and [(x["page"],x["ordinal"]) for x in v["body"]]==[(44,o) for o in range(9,36)]+[(45,o) for o in range(25)] and v["evidence"]["artifact"]==15060641088 and not v["promotion_allowed"])
          test("new_pin_title_and_two_footnotes",[x["type"] for x in v["annotations"]]==["TITLE","FOOTNOTE","FOOTNOTE"] and v["annotations"][0]["text"]=="Hız sınırlarına uyma zorunluluğu:46")
          test("repeated_bent_text_not_deduplicated",all(v["body"][27+i]["text"]==v["body"][32+i]["text"] for i in range(3)))
          test("new_49_quarantine",all(denied(call("TUR053",a49,g),"REVISION_ARTICLE_QUARANTINED") for g in (False,True)))
          test("new_and_previous_g27_exact_22",all((q:=call(rev,g27,g)).returncode==0 and [(x["page"],x["ordinal"]) for x in json.loads(q.stdout)["body"]]==[(98,o) for o in range(12,34)] for rev in ("TUR052","TUR053") for g in (False,True)))
          test("old_g27_quarantine_preserved",all(denied(call(rev,g27,g),"REVISION_ARTICLE_QUARANTINED") for rev in ("TUR049","TUR050","TUR051") for g in (False,True)))
          test("new_pin_wrong_revision_rejected",denied(call("TUR053",a51,path=paths["TUR052"]),"HASH_MISMATCH"))
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/"spoof.sqlite";shutil.copyfile(paths["TUR050"],p)
              db=sqlite3.connect(p);db.execute("UPDATE metadata SET value='TUR053' WHERE key='projection_revision'");db.commit();db.close()
              test("metadata_spoof_with_self_hash_rejected",denied(call("TUR053",g27,True,path=p),"REVISION_ARTICLE_QUARANTINED"))
          test("all_five_original_bytes_unchanged",before=={k:sha(p) for k,p in paths.items()})
          out={"status":"PINNED_AUDIT_READER_ONLY","promotion_allowed":False,"production":"NO-GO","official_legal_source":"NOT_VERIFIED","physical_uat":"NOT_RUN","checks":checks,"input_hashes":before,"wrapper_sha256":sha(pathlib.Path("tools/audit_pinned_reader.py")),"generic_reader_sha256":sha(pathlib.Path("tools/audit_candidate_reader.py")),"limitations":["article-specific current reader quarantine; direct SQLite or old source still possible","no general freshness or digital signature","no product integration"]}
          (r/"result.json").write_text(json.dumps(out,indent=2),encoding="utf-8");print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TUR053-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur053-pin-evidence/
          if-no-files-found: error
