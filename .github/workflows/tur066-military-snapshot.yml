name: TUR066 exact military snapshot (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur066-military-snapshot.yml']
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15022263838'
          run-id: '45618167694'
          github-token: ${{ github.token }}
          path: source44
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15220742803'
          run-id: '46043316831'
          github-token: ${{ github.token }}
          path: prior63
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15222141957'
          run-id: '46046516755'
          github-token: ${{ github.token }}
          path: delta65
      - name: Install independent extractor from signed Ubuntu sources
        run: sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends poppler-utils
      - name: Apply exact delta and prove SQL set differences
        run: |
          python3 - <<'PY'
          import pathlib as P,sqlite3 as S,hashlib as H,json as J,shutil,subprocess,unicodedata
          def sha(p):return H.sha256(p.read_bytes()).hexdigest()
          def file(d,n):return next(P.Path(d).rglob(n))
          def norm(t):return ' '.join(unicodedata.normalize('NFC',t).split())
          pdf=file('source44','u15.pdf');base=file('prior63','reader-candidate.sqlite');delta=file('delta65','result.json')
          inputs=[pdf,base,delta];before=list(map(sha,inputs));checks=[]
          def test(n,v):
              assert v,n
              checks.append({'case':n,'pass':True})
          test('exact_inputs',before==['e66404cf48ef79bf83bb425df04f98f4063a77fbdee99bcdf4a1d8f2f905f35d','cd773dcd4f2eb52d3c2ac3e860b2682b233a89784ddd36d2050a41afcb823b06','e1b9f5d9b217aeb402878ec1f63abbf0db1d716487d2adea814f33853f8a8612'])
          q=J.loads(delta.read_bytes());rows=list(map(tuple,q['body_rows']));anns=list(map(tuple,q['annotations']))
          test('trusted_delta_no_promotion',q['status']=='STAGED_DELTA_ONLY' and q['promotion_allowed'] is False and q['base_sha256']==before[1] and len(rows)==18 and len(anns)==7)
          def aid(n):return f'1632:normal:{n}'
          target=[aid(n) for n in (84,85,87)]
          page=norm(subprocess.check_output(['pdftotext','-f','25','-l','25','-layout',str(pdf),'-'],text=True))
          for n,a,b,stop in [(84,3,5,'Amir ve mafevkine'),(85,7,15,'İtaatsizlik ve cezası'),(87,20,25,'Toplu asker karşısında')]:
              rr=[x for x in rows if x[0]==aid(n)];start=page.index(f'Madde {n} –');end=page.index(stop,start+1)
              test(f'm{n}_delta_exact_pdf',[(x[1],x[2],x[3]) for x in rr]==[(1632,25,o) for o in range(a,b+1)] and page[start:end].strip()==norm(f'Madde {n} – '+' '.join(x[4] for x in rr)))
          test('annotation_hashes_and_ownership',[(x[0],x[1],x[2],x[3]) for x in anns]==[(aid(n),k,25,o) for n,k,o in [(84,'TITLE',2),(85,'TITLE',6),(87,'TITLE',19),(88,'TITLE',26),(88,'TITLE',27),(84,'FOOTNOTE',31),(84,'FOOTNOTE',32)]] and all(H.sha256(x[4].encode()).hexdigest()==x[5] for x in anns) and all(norm(x[4]) in page for x in anns) and norm(anns[3][4]+' '+anns[4][4]+' Madde 88 –') in page and anns[0][4].endswith('28'))
          out=P.Path('tur066-evidence');out.mkdir();dst=out/'reader-candidate.sqlite';shutil.copyfile(base,dst)
          d=S.connect(dst);d.execute('PRAGMA foreign_keys=ON');d.execute('ATTACH DATABASE ? AS old',(base.resolve().as_uri()+'?mode=ro',))
          def query(q,args=()):return d.execute(q,args).fetchall()
          test('old_counts',query('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1484),('WITHHELD_REVIEW',24)] and query('select count(*) from reader_line')==[(18389,)] and query('select count(*) from reader_annotation')==[(105,)])
          for a in target:
              assert query('select status from article_index where id=?',(a,))==[('WITHHELD_REVIEW',)]
              d.execute("update article_index set status='CANDIDATE_UNVERIFIED',reason='SOURCE_BOUNDARY_REVIEW_ONLY' where id=?",(a,))
          d.executemany('insert into reader_line values(?,?,?,?,?)',rows);d.executemany('insert into reader_annotation values(?,?,?,?,?,?)',anns)
          d.execute("update metadata set value='TUR066' where key='projection_revision'")
          def diff(t,reverse=False):
              x,y=('old.','') if reverse else ('','old.')
              return set(query(f'SELECT * FROM {x}{t} EXCEPT SELECT * FROM {y}{t}'))
          test('only_three_status_changes',all({x[0] for x in diff('article_index',r)}==set(target) for r in (False,True)) and all(x[1:6]==next(y[1:6] for y in diff('article_index',True) if y[0]==x[0]) for x in diff('article_index')))
          test('18_body_rows_added_no_removed',diff('reader_line')==set(rows) and not diff('reader_line',True))
          test('7_annotations_added_no_removed',diff('reader_annotation')==set(anns) and not diff('reader_annotation',True))
          test('m88_body_unchanged',query('select * from reader_line where article_id=? order by page,ordinal',(aid(88),))==query('select * from old.reader_line where article_id=? order by page,ordinal',(aid(88),)))
          test('no_heading_note_leak',not query('select 1 from reader_line r join reader_annotation a on r.law=(select law from article_index where id=a.article_id) and r.page=a.page and r.ordinal=a.ordinal'))
          test('counts_exact',query('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1487),('WITHHELD_REVIEW',21)] and query('select count(*) from reader_line')==[(18407,)] and query('select count(*) from reader_annotation')==[(112,)])
          test('21_held_no_leak',not query("select 1 from reader_line where article_id in (select id from article_index where status='WITHHELD_REVIEW')"))
          test('metadata_only_revision',diff('metadata')=={('projection_revision','TUR066')} and diff('metadata',True)=={('projection_revision','TUR063')})
          test('temporal_unchanged',not diff('temporal_decision') and not diff('temporal_decision',True) and query('select count(*) from temporal_decision')==[(11,)] and all(not J.loads(x[0])['automatic_effect'] for x in query('select record from temporal_decision')))
          test('ktk_and_2863_unchanged',all(query('select status,count(*) from article_index where law=? group by status',(law,))==[('CANDIDATE_UNVERIFIED',n)] for law,n in [(2918,187),(2863,98)]))
          olddir=base.parent
          for p in sorted(olddir.glob('*.json')):
              if p.name=='result.json':continue
              name='tur063-boundary-review.json' if p.name=='boundary-review.json' else p.name
              shutil.copyfile(p,out/name)
          rv=J.loads((out/'review-only.json').read_bytes())
          test('review_records_preserved',len(rv['overlay_review'])==119 and len(rv['list_review'])==19 and sum(len(x['members']) for x in rv['list_review'])==90 and len(J.loads((out/'tur058-boundary-review.json').read_bytes())['definition_anchors'])==90 and all(sha(p)==sha(out/('tur063-boundary-review.json' if p.name=='boundary-review.json' else p.name)) for p in olddir.glob('*.json') if p.name!='result.json'))
          d.commit();test('integrity',query('pragma integrity_check')==[('ok',)] and not query('pragma foreign_key_check'));d.close()
          test('original_bytes_unchanged',before==list(map(sha,inputs)))
          shutil.copyfile(delta,out/'boundary-review.json')
          result={'status':'TUR066_BOUNDARY_CANDIDATE_ONLY','promotion_allowed':False,'production':'NO-GO','reader_sha256':sha(dst),'inputs':before,'checks':checks,'candidate_articles':1487,'withheld_articles':21,'body_rows':18407,'annotations':112}
          (out/'result.json').write_text(J.dumps(result,indent=2),encoding='utf-8');print(J.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR066-Military-Snapshot-NOT-RELEASE
          path: tur066-evidence/
          if-no-files-found: error
