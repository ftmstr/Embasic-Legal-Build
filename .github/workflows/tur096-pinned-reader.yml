          github-token: ${{ github.token }}
          path: prior96
      - name: Verify all historical policies and 115 exact access checks
        run: |
          python3 - <<'PY'
          import pathlib as P,hashlib as H,json as J,subprocess,sys,sqlite3 as S,tempfile,shutil,ast,types
          sha=lambda p:H.sha256(p.read_bytes()).hexdigest()
          sys.path.insert(0,'tools')
          import audit_candidate_reader as cr,audit_pinned_reader as pr
          oldref='1a1d192105dd9f6007e0943528ad56aeddab040b'
          oldsrc=subprocess.check_output(['git','show',oldref+':tools/audit_candidate_reader.py']).decode()
          old=types.ModuleType('old_reader');exec(compile(oldsrc,'old_reader.py','exec'),old.__dict__)
          def mapping(source,mod):
              f=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name=='read_article')
              d=next(n.value.func.value for n in f.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='pins' for t in n.targets))
              return {k.value:getattr(mod,v.id) if isinstance(v,ast.Name) else ast.literal_eval(v) for k,v in zip(d.keys,d.values)}
          om=mapping(oldsrc,old);nm=mapping(P.Path('tools/audit_candidate_reader.py').read_text(),cr)
          restored={f'1632:normal:{n}' for n in (31,32)}
          newhash='b2bb8c7508ec6765d795d9cba900c0bd39ae81f187ab015ba10779e92dc928f9'
          new_holds=set()
          allowed={a for a,v in om.items() if v}|restored;holds=set(nm)-allowed
          checks=[]
          def ck(n,v):
              assert v,n
              checks.append({'case':n,'pass':True})
          ck('scope',len(om)==140 and len(nm)==140 and set(nm)==set(om)|new_holds and len(allowed)==115 and len(holds)==25 and all(nm[a]=={} for a in new_holds) and all(not om[a] for a in restored))
          ck('preserve_maps',all(nm[a]==(dict(om[a],TUR096=newhash) if a in allowed else om[a]) for a in om))
          paths={f'TUR{i:03d}':next(P.Path(f'prior{i}').rglob('reader-candidate.sqlite')) for i in list(range(49,64))+list(range(66,97))}
          before={k:sha(v) for k,v in paths.items()}
          ck('all46_inputs',len(paths)==46 and set(pr.PINS)==set(paths)-{'TUR086'} and all(pr.PINS[k]['sha256']==before[k] for k in pr.PINS) and before['TUR086']=='b049a7779f99dcd74269da48203e916b46e1423b39f88c96daedde88b85b0678')
          oldpins=types.ModuleType('old_pins');exec(compile(subprocess.check_output(['git','show',oldref+':tools/audit_pinned_reader.py']),'old_pins.py','exec'),oldpins.__dict__)
          ck('wrapper_old_pins',len(oldpins.PINS)==44 and all(pr.PINS[k]==v for k,v in oldpins.PINS.items()))
          def get(mod,db,a):
              try:return ('OK',mod.read_article(db,a))
              except mod.Denied as e:return ('DENY',str(e))
          deny=('DENY','REVISION_ARTICLE_QUARANTINED')
          base95=cr.snapshot(paths['TUR095'],before['TUR095'])
          for rev in sorted(set(paths)-{'TUR096'}):
              db=cr.snapshot(paths[rev],before[rev]);odb=old.snapshot(paths[rev],before[rev])
              for a in sorted(om):
                  x=get(old,odb,a);y=get(cr,db,a)
                  ck(rev+'_'+a+'_historical',x==y and (x[0]=='OK' if om[a].get(rev)==before[rev] else x==deny))
              for a in sorted(new_holds):ck(rev+'_'+a+'_new_historical_hold',get(cr,db,a)==deny)
              db.close();odb.close()
          db=cr.snapshot(paths['TUR096'],before['TUR096'])
          for a in sorted(allowed-restored):ck(a+'_prior_exact',get(cr,db,a)==get(cr,base95,a) and get(cr,db,a)[0]=='OK')
          base95.close()
          delta=J.loads(next(P.Path('prior96').rglob('boundary-review.json')).read_bytes())
          for a in sorted(restored):
              v=get(cr,db,a)
              ann=[(k,p,o,t,h) for owner,p,o,k,t,h in delta['roles'] if owner==a]
              ck(a+'_restored_exact',v[0]=='OK' and [(x['page'],x['ordinal'],x['text']) for x in v[1]['body']]==[tuple(x) for x in delta['restored'][a]] and [(x['type'],x['page'],x['ordinal'],x['text'],x['source_text_sha256']) for x in v[1]['annotations']]==ann and not v[1]['promotion_allowed'])
          for a in sorted(holds):ck(a+'_new_hold',get(cr,db,a)==deny)
          db.close()
          for a in sorted(nm):
              q=subprocess.run([sys.executable,'tools/audit_pinned_reader.py','--db',str(paths['TUR096']),'--revision','TUR096','--article',a],capture_output=True,text=True)
              if a in allowed:ck(a+'_wrapper_exact',q.returncode==0 and J.loads(q.stdout)['evidence']['artifact']==15278426879 and J.loads(q.stdout)['promotion_allowed'] is False)
              else:ck(a+'_wrapper_hold',q.returncode==65 and not q.stdout and J.loads(q.stderr)['reason']==deny[1])
          with tempfile.TemporaryDirectory() as td:
              t=P.Path(td)/'forged.sqlite';shutil.copyfile(paths['TUR096'],t)
              d=S.connect(t);d.execute("update reader_line set body='synthetic tamper' where article_id='1632:normal:1' and page=1 and ordinal=14");d.executemany("update article_index set status='CANDIDATE_UNVERIFIED' where id=?",[(a,) for a in holds]);d.commit();d.close()
              forged=cr.snapshot(t,sha(t))
              for a in sorted(nm):ck(a+'_self_hash_denied',get(cr,forged,a)==deny)
              forged.close()
              q=subprocess.run([sys.executable,'tools/audit_pinned_reader.py','--db',str(t),'--revision','TUR096','--article','1632:normal:1'],capture_output=True,text=True)
              ck('wrapper_tamper_hash_mismatch',q.returncode==65 and not q.stdout and J.loads(q.stderr)['reason']=='HASH_MISMATCH')
          ck('all46_input_bytes_unchanged',before=={k:sha(v) for k,v in paths.items()})
          ck('grammar_exact',sha(next(P.Path('prior96').rglob('grammar-repaired.sqlite')))=='1cc750ab0611434fa92c586703f2e645f3b5d465e08015abc74c7432e5a2f58a')
          out=P.Path('tur096-pinned-evidence');out.mkdir()
          (out/'result.json').write_text(J.dumps({'checks':checks,'input_hashes':before,'status':'PINNED_AUDIT_READER_ONLY','production':'NO-GO','promotion_allowed':False,'generic_reader_sha256':sha(P.Path('tools/audit_candidate_reader.py')),'wrapper_sha256':sha(P.Path('tools/audit_pinned_reader.py'))},indent=2))
          print('PASS',len(checks),'45 prior snapshots, 115 exact, 25 holds, TUR086 unpinned')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR096-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur096-pinned-evidence/
          if-no-files-found: error
