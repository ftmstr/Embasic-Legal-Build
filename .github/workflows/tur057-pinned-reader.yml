name: TUR057 multi-clause candidate snapshot (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur057-pinned-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15057816038'
          run-id: '45687953803'
          github-token: ${{ github.token }}
          path: prior49
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15056664563'
          run-id: '45688754638'
          github-token: ${{ github.token }}
          path: prior50
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15058496001'
          run-id: '45689770047'
          github-token: ${{ github.token }}
          path: prior51
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060085952'
          run-id: '45693327586'
          github-token: ${{ github.token }}
          path: prior52
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060641088'
          run-id: '45694684288'
          github-token: ${{ github.token }}
          path: prior53
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060707849'
          run-id: '45696360940'
          github-token: ${{ github.token }}
          path: prior54
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15064090183'
          run-id: '45700585363'
          github-token: ${{ github.token }}
          path: prior55
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093086567'
          run-id: '45768293248'
          github-token: ${{ github.token }}
          path: prior56
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093895209'
          run-id: '45769614123'
          github-token: ${{ github.token }}
          path: prior57
      - name: Verify adjacent holds and exact candidate snapshot policy
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess,sys,sqlite3,tempfile,shutil
          paths={f"TUR{i:03d}":next(pathlib.Path(f"prior{i}").rglob("reader-candidate.sqlite")) for i in range(49,58)}
          r=pathlib.Path("tur057-pin-evidence");r.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={k:sha(p) for k,p in paths.items()}
          checks=[]
          def test(n,v):
              assert v,n
              checks.append({"case":n,"pass":True})
          def call(rev,aid,generic=False,path=None):
              p=path or paths[rev]
              args=["tools/audit_candidate_reader.py","--db",str(p),"--expected-sha256",sha(p)] if generic else ["tools/audit_pinned_reader.py","--db",str(p),"--revision",rev]
              return subprocess.run([sys.executable,*args,"--article",aid],capture_output=True,text=True,encoding="utf-8")
          def denied(p,reason):return p.returncode==65 and not p.stdout and json.loads(p.stderr)["reason"]==reason
          def aid(n):return f"2918:normal:{n}"
          g27="2918:geçici:27"
          for rev in paths:
              test(rev+"_new_holds",all(denied(call(rev,aid(n),g),"REVISION_ARTICLE_QUARANTINED") for n in (3,45) for g in (False,True)))
          for n,coords,title,note in [(4,[(7,o) for o in range(24,36)]+[(8,o) for o in range(10)],"Görevli kurullar ve kuruluşlar:4",4),(46,[(37,o) for o in range(17,34)]+[(38,o) for o in range(37)]+[(39,o) for o in range(20)],"Karayollarında trafiğin akışı:",41)]:
              q=call("TUR057",aid(n));v=json.loads(q.stdout)
              test(f"m{n}_exact_new_body",q.returncode==0 and [(x["page"],x["ordinal"]) for x in v["body"]]==coords and v["evidence"]["artifact"]==15093895209 and not v["promotion_allowed"])
              test(f"m{n}_title_and_note",v["annotations"][0]["text"]==title and len(v["annotations"])==3 and v["annotations"][1]["text"].startswith(str(note)+" "))
              q=call("TUR057",aid(n),True)
              test(f"m{n}_generic_match",q.returncode==0 and json.loads(q.stdout)["body"]==v["body"])
          test("prior_targets_remain_held",all(denied(call("TUR056",aid(n)),"WITHHELD_REVIEW") for n in (4,46)))
          test("m5_note5_owner",(q:=call("TUR057",aid(5))).returncode==0 and [(x["page"],x["ordinal"]) for x in json.loads(q.stdout)["annotations"] if x["type"]=="FOOTNOTE"]==[(8,o) for o in range(36,39)])
          test("m47_remains_held",denied(call("TUR057",aid(47)),"WITHHELD_REVIEW"))
          policies=[(aid(28),56,7),(aid(29),56,6),(aid(49),54,34),(g27,52,22)]
          test("previous_unsafe_revisions_rejected",all(denied(call(f"TUR{i:03d}",a,g),"REVISION_ARTICLE_QUARANTINED") for a,start,n in policies for i in range(49,start) for g in (False,True)))
          test("all_prior_safe_pins_preserved",all(call(f"TUR{i:03d}",a,g).returncode==0 for a,start,n in policies for i in range(start,57) for g in (False,True)))
          test("new_exact_prior_article_counts",all((q:=call("TUR057",a,g)).returncode==0 and len(json.loads(q.stdout)["body"])==n for a,start,n in policies for g in (False,True)))
          test("cross_revision_rejected",denied(call("TUR057",aid(4),path=paths["TUR056"]),"HASH_MISMATCH"))
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/"local.sqlite";shutil.copyfile(paths["TUR056"],p)
              db=sqlite3.connect(p);db.execute("UPDATE metadata SET value='TUR057' WHERE key='projection_revision'");db.commit();db.close()
              test("self_hash_unregistered_snapshot_rejected",all(denied(call("TUR057",a,True,path=p),"REVISION_ARTICLE_QUARANTINED") for a,start,n in policies))
          test("all_nine_input_bytes_unchanged",before=={k:sha(p) for k,p in paths.items()})
          out={"status":"PINNED_AUDIT_READER_ONLY","promotion_allowed":False,"production":"NO-GO","official_legal_source":"NOT_VERIFIED","physical_uat":"NOT_RUN","checks":checks,"input_hashes":before,"wrapper_sha256":sha(pathlib.Path("tools/audit_pinned_reader.py")),"generic_reader_sha256":sha(pathlib.Path("tools/audit_candidate_reader.py")),"limitations":["current reader policy only; historical code and direct SQLite remain available","no general freshness or digital signature","no Windows product integration"]}
          (r/"result.json").write_text(json.dumps(out,indent=2),encoding="utf-8");print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR057-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur057-pin-evidence/
          if-no-files-found: error
