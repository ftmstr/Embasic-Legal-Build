name: TUR077 military source repair (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur077-military-snapshot.yml']
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15022263838'
          run-id: '45618167694'
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15233040668'
          run-id: '46070012721'
          github-token: ${{ github.token }}
          path: base
      - name: Install independent extractor
        run: sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y --no-install-recommends poppler-utils
      - name: Source audit and isolated repair
        run: |
          python3 - <<'PY'
          import pathlib as P,sqlite3 as S,hashlib as H,json as J,shutil,subprocess,unicodedata,re
          def sha(p):return H.sha256(p.read_bytes()).hexdigest()
          def norm(t):return ' '.join(unicodedata.normalize('NFC',t).split())
          pdf=next(P.Path('source').rglob('u15.pdf'));base=next(P.Path('base').rglob('reader-candidate.sqlite')).parent
          g=base/'grammar-repaired.sqlite';r=base/'reader-candidate.sqlite';prev=base/'boundary-review.json';out=P.Path('out');out.mkdir()
          inputs=[pdf,g,r,prev];before=list(map(sha,inputs));checks=[]
          def test(n,v):
              assert v,n
              checks.append({'case':n,'pass':True})
          test('exact_inputs',before==['e66404cf48ef79bf83bb425df04f98f4063a77fbdee99bcdf4a1d8f2f905f35d','f959bf24453bdc2a16a192075ba0ba612bdd97369c345fb1e300cf5d07035b0e','438ae4e05c5deae7d462f78eb3e7605709c01b74e0fa04dd03c2282f90a6c4c1','ebd9b10e55ab07440de0956dd1042d40c5c24f27e47376a42d59c257cecf81a9'])
          s=S.connect(g.resolve().as_uri()+'?mode=ro',uri=True);s.row_factory=S.Row
          def a(n):return f'1632:normal:{n}'
          def line(p,o):return dict(s.execute('select * from line where law=1632 and page=? and ordinal=?',(p,o)).fetchone())
          def ev(x):return {'page':x['page'],'ordinal':x['ordinal'],'raw':x['raw'],'bbox':J.loads(x['bbox']),'source_text_sha256':H.sha256(x['raw'].encode()).hexdigest()}
          def members(n):return [dict(x) for x in s.execute('select m.*,l.raw,l.bbox,l.classification,l.spans from membership m join line l using(law,page,ordinal) where article_id=? order by page,ordinal',(a(n),))]
          def coords(rs):return [(x['page'],x['ordinal']) for x in rs]
          def supers(p,o):return [x for x in J.loads(line(p,o)['spans']) if x['flags']&1 and x['text'].strip()]
          for p,c in [(36,35),(37,34),(38,36)]:
              raw=[dict(x) for x in s.execute('select * from line where law=1632 and page=? order by ordinal',(p,))]
              test(f'p{p}_independent_text',len(raw)==c and [x['ordinal'] for x in raw]==list(range(c)) and norm(subprocess.check_output(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-'],text=True))==norm(' '.join(x['raw'] for x in raw)))
          specs={139:([(36,o) for o in range(25,29)],[(36,24)],[]),140:([(37,o) for o in range(4)],[(36,29)],[]),143:([(37,o) for o in range(12,20)],[(37,11)],[(37,30),(37,31)]),144:([(37,o) for o in range(21,24)],[(37,20)],[]),145:([(37,28),(37,29)],[(37,26),(37,27)],[(37,32),(37,33),(38,31),(38,32)])}
          leaks={139:[(36,29)],144:[(37,24),(37,25),(37,26)]};anchors={143:(37,11,'34'),145:(37,28,'35')}
          rows=[];anns=[];roles=[];records={}
          for n,(cc,tt,ff) in specs.items():
              rs=members(n);valid=rs[:len(cc)]
              test(f'm{n}_body_boundary',coords(rs)==cc+leaks.get(n,[]) and coords(valid)==cc)
              for i,x in enumerate(valid):
                  raw=x['raw']
                  if (x['page'],x['ordinal'])==(37,28):
                      raw=''.join(z['text'] for z in J.loads(x['spans']) if not (z['flags']&1 and z['text'].strip().isdigit())).strip()
                  expected=raw.split(' – ',1)[1] if i==0 else raw
                  assert x['body']==expected,(n,x['page'],x['ordinal'])
              test(f'm{n}_body_exact',True)
              test(f'm{n}_no_explicit_literal_nodes',not s.execute('select 1 from node where article_id=?',(a(n),)).fetchall() and not s.execute('select 1 from grammar_overlay where parent_id=?',(a(n),)).fetchall() and not any(re.match(r'^(?:[A-Z][:)]|\d+\.|\d+ -)',x['body']) for x in valid))
              ts=[ev(line(*c)) for c in tt];fs=[ev(line(*c)) for c in ff]
              test(f'm{n}_annotation_roles',all(line(*c)['classification']=='FOOTNOTE_CANDIDATE' for c in ff) and all(line(*c)['classification'] in ('HEADING_CANDIDATE','BODY_CANDIDATE') for c in tt))
              for kind,cs in [('TITLE',tt),('FOOTNOTE',ff)]:
                  for p,o in cs:
                      x=ev(line(p,o));anns.append((a(n),kind,p,o,x['raw'],x['source_text_sha256']));roles.append((1632,p,o,a(n),kind,x['source_text_sha256']))
              rows.extend((a(n),1632,x['page'],x['ordinal'],x['body']) for x in valid)
              records[str(n)]={'body':[ev(x) for x in valid],'titles':ts,'footnotes':fs,'legal_paragraph_number':None}
              if n in anchors:
                  p,o,f=anchors[n];ss=supers(p,o)
                  test(f'm{n}_footnote_owner',len(ss)==1 and ss[0]['text']==f and line(*ff[0])['raw'].startswith(f+' '))
                  records[str(n)]['footnote_anchor']={'source':ev(line(p,o)),'superscript_span':ss[0],'number':f,'footnote_coordinates':ff,'body_omits_only_superscript':n==145}
          test('all_numeric_superscripts_accounted',[(p,o,z['text']) for p,c in [(36,35),(37,34),(38,36)] for o in range(c) for z in supers(p,o)]==[(36,9,'32'),(36,19,'33'),(37,11,'34'),(37,28,'35'),(38,10,'36'),(38,24,'37')])
          test('m140_cross_page_title',line(36,29)['raw']=='Mahsup ve mevkufları firar ettirenler:' and line(37,0)['classification']=='ARTICLE_HEADER')
          test('m144_chapter',line(37,24)['raw']=='ONUNCU FASIL' and line(37,25)['raw']=='Askeri disiplini bozan sair fiiller')
          test('m145_title_and_cross_page_footnote',line(37,26)['raw'].startswith('Madununa nezarete ihmal edenler') and line(37,27)['raw']=='bulunmayanlar:' and line(38,31)['raw'].startswith('Hakkında Kanunun 54 üncü maddesiyle') and line(38,32)['raw']=='maddesiyle yürürlükten kaldırılmıştır.' and line(38,33)['raw'].startswith('36 '))
          test('m143_amendment_and_literal_references','(Değişik: 22/3/2000-4551/29 md.)' in line(37,12)['raw'] and '301, 302,' in line(37,2)['raw'] and '303, 304,305, 306 ve 307' in line(37,3)['raw'] and '(T.C.K.B: F:4)' in line(37,23)['raw'])
          records['140']['literal_references']=[ev(line(37,2)),ev(line(37,3))]
          records['144']['literal_references']=[ev(line(37,23))]
          for p,o in [(37,24),(37,25)]:roles.append((1632,p,o,None,'CHAPTER_HEADING',ev(line(p,o))['source_text_sha256']))
          gdpath=out/g.name;shutil.copyfile(g,gdpath);gd=S.connect(gdpath);gd.execute('pragma foreign_keys=ON');gd.execute('attach database ? as old',(g.resolve().as_uri()+'?mode=ro',))
          def diff(db,t,rev=False):
              x,y=('old.','') if rev else ('','old.')
              return set(db.execute(f'select * from {x}{t} except select * from {y}{t}'))
          removed_membership={(a(n),1632,p,o,line(p,o)['body']) for n,cs in leaks.items() for p,o in cs}
          gd.executemany('delete from membership where article_id=? and law=? and page=? and ordinal=?',[x[:4] for x in sorted(removed_membership)])
          gd.executemany('insert into source_boundary_repair values(?,?,?,?,?,?)',roles)
          test('four_wrong_memberships_removed',len(removed_membership)==4 and not diff(gd,'membership') and diff(gd,'membership',True)==removed_membership)
          test('fourteen_new_roles',len(roles)==14 and diff(gd,'source_boundary_repair')==set(roles) and not diff(gd,'source_boundary_repair',True) and gd.execute('select count(*) from source_boundary_repair').fetchone()==(58,) and not gd.execute('select 1 from membership m join source_boundary_repair z using(law,page,ordinal)').fetchall())
          tables=[x[0] for x in gd.execute("select name from old.sqlite_master where type='table'")]
          test('other_grammar_tables_unchanged_including_node_overlay',all(not diff(gd,t) and not diff(gd,t,True) for t in tables if t not in ('membership','source_boundary_repair')))
          gd.commit();test('grammar_integrity',gd.execute('pragma integrity_check').fetchone()==('ok',) and not gd.execute('pragma foreign_key_check').fetchall());gd.close()
          dst=out/r.name;shutil.copyfile(r,dst);d=S.connect(dst);d.execute('pragma foreign_keys=ON');d.execute('attach database ? as old',(r.resolve().as_uri()+'?mode=ro',));q=lambda sql,args=():d.execute(sql,args).fetchall()
          test('baseline',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1501),('WITHHELD_REVIEW',7)] and q('select count(*) from reader_line')==[(18514,)] and q('select count(*) from reader_annotation')==[(160,)])
          for n in (138,141,142,146,147):
              test(f'neighbor_m{n}_body_preserved',q('select page,ordinal,body from reader_line where article_id=? order by page,ordinal',(a(n),))==[(x['page'],x['ordinal'],x['body']) for x in members(n)])
          targets=[a(n) for n in specs];holds=[a(148),a(149)]
          for aid in targets:
              assert q('select status from article_index where id=?',(aid,))==[('WITHHELD_REVIEW',)]
              d.execute("update article_index set status='CANDIDATE_UNVERIFIED',reason='SOURCE_BOUNDARY_REVIEW_ONLY' where id=?",(aid,))
          d.executemany('insert into reader_line values(?,?,?,?,?)',rows);d.executemany('insert into reader_annotation values(?,?,?,?,?,?)',anns);d.execute("update metadata set value='TUR077' where key='projection_revision'")
          test('five_index_changes',all({x[0] for x in diff(d,'article_index',v)}==set(targets) for v in (False,True)) and {x[:6] for x in diff(d,'article_index')}=={x[:6] for x in diff(d,'article_index',True)})
          test('21_body_add_only',len(rows)==21 and diff(d,'reader_line')==set(rows) and not diff(d,'reader_line',True))
          test('12_annotations_add',len(anns)==12 and diff(d,'reader_annotation')==set(anns) and not diff(d,'reader_annotation',True))
          test('counts',q('select status,count(*) from article_index group by status order by status')==[('CANDIDATE_UNVERIFIED',1506),('WITHHELD_REVIEW',2)] and q('select count(*) from reader_line')==[(18535,)] and q('select count(*) from reader_annotation')==[(172,)])
          test('two_held_exact',set(q("select id from article_index where status='WITHHELD_REVIEW'"))=={(x,) for x in holds})
          test('no_leak',not q("select 1 from reader_line where article_id in (select id from article_index where status='WITHHELD_REVIEW')") and not q("select 1 from reader_annotation where article_id in (select id from article_index where status='WITHHELD_REVIEW')") and not q('select 1 from reader_line r join reader_annotation z on r.law=(select law from article_index where id=z.article_id) and r.page=z.page and r.ordinal=z.ordinal'))
          test('metadata_only_revision',diff(d,'metadata')=={('projection_revision','TUR077')} and diff(d,'metadata',True)=={('projection_revision','TUR076')})
          test('temporal_preserved',not diff(d,'temporal_decision') and not diff(d,'temporal_decision',True) and q('select count(*) from temporal_decision')==[(11,)] and all(not J.loads(x[0])['automatic_effect'] for x in q('select record from temporal_decision')))
          test('ktk_2863_preserved',all(q('select status,count(*) from article_index where law=? group by status',(law,))==[('CANDIDATE_UNVERIFIED',n)] for law,n in [(2918,187),(2863,98)]))
          for p in base.glob('*.json'):
              if p.name!='result.json':shutil.copyfile(p,out/('tur076-boundary-review.json' if p.name=='boundary-review.json' else p.name))
          rv=J.loads((out/'review-only.json').read_bytes());m95=J.loads((out/'tur069-boundary-review.json').read_bytes())
          test('prior_json_and_m95_preserved',all(sha(p)==sha(out/('tur076-boundary-review.json' if p.name=='boundary-review.json' else p.name)) for p in base.glob('*.json') if p.name!='result.json') and len(rv['overlay_review'])==119 and len(rv['list_review'])==19 and sum(len(x['members']) for x in rv['list_review'])==90 and len(J.loads((out/'tur058-boundary-review.json').read_bytes())['definition_anchors'])==90 and len(m95['records']['95']['overlay_additions'])==9 and len(m95['records']['95']['references'])==3 and m95['legacy_nodes_authoritative'] is False)
          d.commit();test('reader_integrity',q('pragma integrity_check')==[('ok',)] and not q('pragma foreign_key_check'));d.close();s.close()
          test('original_bytes_unchanged',before==list(map(sha,inputs)))
          (out/'boundary-review.json').write_text(J.dumps({'records':records,'body_rows':rows,'annotations':anns,'new_nodes':[],'new_overlays':[],'removed_membership':sorted(removed_membership),'source_boundary_roles':roles,'unconditional_hold':[148,149],'legacy_nodes_authoritative':False,'legal_acceptance':False,'promotion_allowed':False},ensure_ascii=False,indent=2),encoding='utf-8')
          result={'status':'TUR077_BOUNDARY_CANDIDATE_ONLY','promotion_allowed':False,'production':'NO-GO','reader_sha256':sha(dst),'grammar_sha256':sha(gdpath),'inputs':before,'checks':checks,'candidate_articles':1506,'withheld_articles':2,'body_rows':18535,'annotations':172}
          (out/'result.json').write_text(J.dumps(result,indent=2),encoding='utf-8');print(J.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR077-Military-Snapshot-NOT-RELEASE
          path: out/
          if-no-files-found: error
