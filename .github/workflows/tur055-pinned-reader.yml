name: TUR055 candidate snapshot and boundary policy (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur055-pinned-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15057816038'
          run-id: '45687953803'
          github-token: ${{ github.token }}
          path: prior49
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15056664563'
          run-id: '45688754638'
          github-token: ${{ github.token }}
          path: prior50
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15058496001'
          run-id: '45689770047'
          github-token: ${{ github.token }}
          path: prior51
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060085952'
          run-id: '45693327586'
          github-token: ${{ github.token }}
          path: prior52
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060641088'
          run-id: '45694684288'
          github-token: ${{ github.token }}
          path: prior53
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060707849'
          run-id: '45696360940'
          github-token: ${{ github.token }}
          path: prior54
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15064090183'
          run-id: '45700585363'
          github-token: ${{ github.token }}
          path: prior55
      - name: Verify new revision and historical boundary holds
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess,sys,sqlite3,tempfile,shutil
          paths={f"TUR{i:03d}":next(pathlib.Path(f"prior{i}").rglob("reader-candidate.sqlite")) for i in range(49,56)}
          r=pathlib.Path("tur055-pin-evidence");r.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={k:sha(p) for k,p in paths.items()}
          checks=[]
          def test(n,v):
              assert v,n
              checks.append({"case":n,"pass":True})
          def call(rev,aid,generic=False,path=None):
              p=path or paths[rev]
              args=["tools/audit_candidate_reader.py","--db",str(p),"--expected-sha256",sha(p)] if generic else ["tools/audit_pinned_reader.py","--db",str(p),"--revision",rev]
              return subprocess.run([sys.executable,*args,"--article",aid],capture_output=True,text=True,encoding="utf-8")
          def denied(p,reason):return p.returncode==65 and not p.stdout and json.loads(p.stderr)["reason"]==reason
          a31="2918:normal:31";a49="2918:normal:49";g27="2918:geçici:27"
          holds=("2918:normal:28","2918:normal:29")
          for rev in paths:
              test(rev+"_new_boundary_holds",all(denied(call(rev,aid,g),"REVISION_ARTICLE_QUARANTINED") for aid in holds for g in (False,True)))
          q=call("TUR055",a31);v=json.loads(q.stdout)
          test("new_31_exact_coordinates",q.returncode==0 and [(x["page"],x["ordinal"]) for x in v["body"]]==[(27,o) for o in range(17,38)]+[(28,o) for o in range(39)]+[(29,o) for o in range(18)] and v["evidence"]["artifact"]==15064090183 and not v["promotion_allowed"])
          test("new_31_separate_title",[x["type"] for x in v["annotations"]]==["TITLE"] and v["annotations"][0]["text"]=="Araçlarda bulundurulması zorunlu gereçler:")
          test("new_31_generic_matches",(q:=call("TUR055",a31,True)).returncode==0 and json.loads(q.stdout)["body"]==v["body"])
          test("new_30_correct_title",(q:=call("TUR055","2918:normal:30")).returncode==0 and json.loads(q.stdout)["annotations"][0]["text"]=="Araçların teknik şartlara uygunluğu:")
          test("new_32_owns_eight_note_lines",(q:=call("TUR055","2918:normal:32")).returncode==0 and [(x["page"],x["ordinal"]) for x in json.loads(q.stdout)["annotations"] if x["type"]=="FOOTNOTE"]==[(29,o) for o in range(32,40)])
          test("new_revision_49_and_g27_exact_bodies",all((q:=call("TUR055",aid,g)).returncode==0 and len(json.loads(q.stdout)["body"])==n for aid,n in ((a49,34),(g27,22)) for g in (False,True)))
          test("old_known_49_and_g27_holds",all(denied(call(f"TUR{i:03d}",aid,g),"REVISION_ARTICLE_QUARANTINED") for aid,limit in ((a49,54),(g27,52)) for i in range(49,limit) for g in (False,True)))
          test("historical_safe_49_and_g27_pins",all(call(f"TUR{i:03d}",aid,g).returncode==0 for aid,start in ((a49,54),(g27,52)) for i in range(start,55) for g in (False,True)))
          test("old_31_stays_held",denied(call("TUR054",a31),"WITHHELD_REVIEW"))
          test("revision_mismatch",denied(call("TUR055",a31,path=paths["TUR054"]),"HASH_MISMATCH"))
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/"local.sqlite";shutil.copyfile(paths["TUR054"],p)
              db=sqlite3.connect(p);db.execute("UPDATE metadata SET value='TUR055' WHERE key='projection_revision'");db.commit();db.close()
              test("unregistered_snapshot_refuses_prior_reviewed_articles",all(denied(call("TUR055",aid,True,path=p),"REVISION_ARTICLE_QUARANTINED") for aid in (a49,g27)))
          test("all_original_bytes_unchanged",before=={k:sha(p) for k,p in paths.items()})
          out={"status":"PINNED_AUDIT_READER_ONLY","promotion_allowed":False,"production":"NO-GO","official_legal_source":"NOT_VERIFIED","physical_uat":"NOT_RUN","checks":checks,"input_hashes":before,"wrapper_sha256":sha(pathlib.Path("tools/audit_pinned_reader.py")),"generic_reader_sha256":sha(pathlib.Path("tools/audit_candidate_reader.py")),"limitations":["current reader only; historical code and direct SQLite not restricted","no general freshness or signature","no product integration"]}
          (r/"result.json").write_text(json.dumps(out,indent=2),encoding="utf-8");print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR055-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur055-pin-evidence/
          if-no-files-found: error
