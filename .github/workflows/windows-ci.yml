name: TUR043 audit branch packaging isolation (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/windows-ci.yml']
permissions:
  contents: read
jobs:
  audit-isolation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/audit/tur035-nuget-byte-parity'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inventory exact product and audit workflow surfaces without building
        shell: pwsh
        run: |
          @'
          import subprocess, pathlib, json, re, hashlib, os
          root=pathlib.Path("tur043-evidence"); root.mkdir()
          product="9f9af1fb33fb0f69c6d3f1f408e467a856e4ca0f"
          prior="68d2819890f90c38d10c5edf00e722e09ea038a7"
          main="b7e1e8fabcadd4e6cae93db9974e9c173a77bb5b"
          def git(*args): return subprocess.check_output(["git",*args])
          def check(c,m):
              if not c: raise RuntimeError(m)
          def inventory(ref):
              rows=[]
              for entry in git("ls-tree","-r",ref).decode().splitlines():
                  meta,path=entry.split("\t",1)
                  mode,kind,blob=meta.split()
                  if kind=="blob" and path.startswith(".github/workflows/"):
                      raw=git("show",ref+":"+path)
                      lines=raw.decode("utf-8-sig").splitlines()
                      rows.append({"path":path,"blob":blob,"sha256":hashlib.sha256(raw).hexdigest(),
                        "upload_actions":[{"line":i+1,"text":s.strip()} for i,s in enumerate(lines) if re.search(r"uses:\s*actions/upload-artifact@",s)],
                        "upload_path_lines":[{"line":i+1,"text":s.strip()} for i,s in enumerate(lines) if re.search(r"^\s+path:\s*(dist/|tur\d+[^ ]*evidence)",s)],
                        "publish_command_lines":[i+1 for i,s in enumerate(lines) if re.search(r"^\s*(?:run:\s*)?dotnet publish\s",s)],
                        "pr_trigger_lines":[i+1 for i,s in enumerate(lines) if re.match(r"^\s+pull_request\s*:",s)],
                        "write_permission_lines":[i+1 for i,s in enumerate(lines) if re.match(r"^\s+\w+\s*:\s*write\s*$",s)]})
              return rows
          head=git("rev-parse","HEAD").decode().strip()
          result={"audit_only":True,"production":"NO-GO","license_release":"NO-GO","physical_uat":"NOT_RUN","official_law":"NOT_VERIFIED","product_head":product,"audit_head":head,"checks":[]}
          def passed(label,condition):
              check(condition,label)
              result["checks"].append({"case":label,"pass":True})
          try:
              passed("exact_runner_head",head==os.environ["GITHUB_SHA"])
              passed("audit_push_only",os.environ["GITHUB_EVENT_NAME"]=="push" and os.environ["GITHUB_REF"]=="refs/heads/audit/tur035-nuget-byte-parity")
              p=inventory(product); a=inventory(prior); n=inventory(head); m=inventory(main)
              result["inventory"]={"product":p,"prior_audit":a,"current_audit":n,"main":m}
              passed("product_alpha_route_preserved",len(p)==1 and p[0]["blob"]=="d85d4ef2bdb437e7dcec354e73967c0435b1fdea" and len(p[0]["publish_command_lines"])==1 and len(p[0]["upload_actions"])==1)
              passed("main_has_no_workflows_at_pinned_ref",not m)
              amap={r["path"]:r for r in a}; nmap={r["path"]:r for r in n}
              key=".github/workflows/windows-ci.yml"
              passed("prior_audit_inherited_product_route",amap[key]["blob"]==p[0]["blob"])
              passed("only_inherited_workflow_changed",set(amap)==set(nmap) and len(nmap)==10 and all(amap[k]["blob"]==nmap[k]["blob"] for k in amap if k!=key) and amap[key]["blob"]!=nmap[key]["blob"])
              diff=git("diff","--name-only",prior,head).decode().splitlines()
              passed("no_other_source_changes",diff==[key])
              passed("audit_workflows_no_dotnet_publish_or_pr_trigger",all(not r["publish_command_lines"] and not r["pr_trigger_lines"] for r in n))
              passed("audit_workflows_no_explicit_write_permissions",all(not r["write_permission_lines"] for r in n))
              passed("audit_workflows_no_dist_upload_path",all(not any("dist/" in s["text"] for s in r["upload_path_lines"]) for r in n))
              result["status"]="AUDIT_INHERITED_ALPHA_ROUTE_REMOVED"
          finally:
              (root/"result.json").write_text(json.dumps(result,indent=2,sort_keys=True),encoding="utf-8")
              print("TUR043_RESULT",json.dumps(result))
          '@ | Set-Content -Encoding utf8 tur043.py
          python tur043.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TUR043-Audit-Isolation-Evidence-NOT-RELEASE
          path: tur043-evidence/result.json
          if-no-files-found: error
