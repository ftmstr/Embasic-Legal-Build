name: Windows WPF Alpha CI
on:
  push:
    branches:
      - 'tur*/**'
  pull_request:
    branches:
      - main
      - 'tur*/**'
permissions:
  contents: read
jobs:
  windows-build-test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Embasic.Legal.slnx
      - name: Build
        run: dotnet build Embasic.Legal.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Embasic.Legal.Tests/Embasic.Legal.Tests.csproj -c Release --no-restore --logger trx
      - name: Publish Windows standalone alpha
        run: dotnet publish src/Embasic.Legal.Desktop/Embasic.Legal.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o dist/EmbasicLegal
      - name: Source asset and legal source status
        shell: pwsh
        run: |
          if (-not (Test-Path assets/Embasic_Legal_E_Terazi.ico)) { throw "ICO missing" }
          if (-not (Test-Path assets/Embasic_Legal_E_Terazi_Ikon.png)) { throw "PNG missing" }
          if (-not (Test-Path assets/LOGO-PROVENANCE-TUR002.md)) { throw "Provenance record missing" }
          $expected = @{
            'assets/Embasic_Legal_E_Terazi.ico' = 'd63486e7e387146875f81c93c83dc94b9d931d63632bfb6eb878addd4840b489'
            'assets/Embasic_Legal_E_Terazi_Ikon.png' = 'ee0f9ed1c3c561e925d3374d07fa5e79ab678d9a07a9673ccffff1acc5c2599a'
          }
          foreach ($path in $expected.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$path]) { throw "Original logo source hash mismatch: $path" }
            Write-Host "$path $actual ORIGINAL_SOURCE_MATCH"
          }
      - name: Package manual offline Windows UAT collector
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'tools/TUR024-Windows-UAT.ps1' -Destination 'dist/EmbasicLegal/TUR024-Windows-UAT.ps1'
      - name: Static WPF and UAT syntax checks (NOT a physical GUI test)
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/TUR024-Windows-UAT.ps1',[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "PowerShell parser rejected UAT: $($parseErrors.Count)" }
          [xml]$screen = Get-Content 'src/Embasic.Legal.Desktop/App.xaml' -Raw
          $raw = $screen.OuterXml
          foreach ($marker in @('PenaltyMoneyViewModel','Ceza oran hesaplama','Hapis / para hesabı','YDO / para dönüşümü','SystematicsPage','Gece Vakti','SeizureTime','AYM İptali','AuthorizationBasis','ExportWitnessCommand','VerifyWitnessCommand','AuditLegacyExposureCommand')) {
            if (-not $raw.Contains($marker)) { throw "WPF source marker absent: $marker" }
          }
          $vm = Get-Content 'src/Embasic.Legal.Desktop/ViewModels/NoteSandboxViewModel.cs' -Raw
          foreach ($marker in @('AUTO_SQLITE_METADATA_CONSENT','AllowAutomaticSqliteBackup(forDelete: false)','AllowAutomaticSqliteBackup(forDelete: true)','RequireApprovalForDeletion()','_automaticBackupConsent.Reset()')) {
            if (-not $vm.Contains($marker)) { throw "Missing TUR024 consent marker: $marker" }
          }
          $riskGate = Get-Content 'src/Embasic.Legal.Infrastructure/VaultArtifactRiskGates.cs' -Raw
          foreach ($marker in @('File.GetAttributes(candidate)','FileNotFoundException','DirectoryNotFoundException','SQLite yan dosyasının varlığı/türü')) {
            if (-not $riskGate.Contains($marker)) { throw "TUR024 entry-type fail-closed marker absent: $marker" }
          }
          $vault = Get-Content 'src/Embasic.Legal.Infrastructure/EncryptedArticleNotes.cs' -Raw
          foreach ($marker in @('using var authenticated = new EncryptedArticleNotes(', 'readOnlyExisting: true', 'if (existing && !readOnlyExisting)')) {
            if (-not $vault.Contains($marker)) { throw "Missing TUR024 pre-auth read-only gate marker: $marker" }
          }
          $vaultGate = Get-Content 'src/Embasic.Legal.Infrastructure/EncryptedArticleNotes.cs' -Raw
          $entryIndex = $vaultGate.IndexOf('VaultArtifactRiskGates.RequireNoSqliteSidecars(fullPath);', [System.StringComparison]::Ordinal)
          $openIndex = $vaultGate.IndexOf('_store = new ArticleNoteStore(fullPath', [System.StringComparison]::Ordinal)
          if ($entryIndex -lt 0 -or $openIndex -lt 0 -or $entryIndex -gt $openIndex) {
            throw 'TUR024 normal vault startup sidecar guard absent or placed after SQLite open.'
          }
          $vaultRestore = Get-Content 'src/Embasic.Legal.Infrastructure/EncryptedArticleNotes.cs' -Raw
          $vaultArtifact = Get-Content 'src/Embasic.Legal.Infrastructure/VaultArtifactRiskGates.cs' -Raw
          foreach ($marker in @('RequireUnusedRollbackDestination(rollbackDestination)', 'RequireUnusedRollbackDestination(rollbackDestination!)')) {
            if (-not $vaultRestore.Contains($marker)) { throw "Missing TUR024 restore rollback guard marker: $marker" }
          }
          foreach ($marker in @('public static void RequireUnusedRollbackDestination', 'RequireNoSqliteSidecars(absolute)', 'File.GetAttributes(absolute)')) {
            if (-not $vaultArtifact.Contains($marker)) { throw "Missing TUR024 rollback destination entry gate: $marker" }
          }
          $app = Get-Content 'src/Embasic.Legal.Desktop/App.xaml' -Raw
          $main = Get-Content 'src/Embasic.Legal.Desktop/ViewModels/MainViewModel.cs' -Raw
          $education = Get-Content 'src/Embasic.Legal.Desktop/ViewModels/CmkLearningHubViewModel.cs' -Raw
          $catalog = Get-Content 'src/Embasic.Legal.Core/CmkLearningCatalog.cs' -Raw
          foreach ($marker in @('CmkLearningHubViewModel','Karşılaştırmalı kontrol matrisi','Yanıtı değerlendir','İşlem akışını öğren','NOT_VERIFIED')) {
            if (-not $app.Contains($marker)) { throw "Missing TUR024 WPF learning UI marker: $marker" }
          }
          if (-not $main.Contains('"learning" => _learningHub')) { throw 'TUR024 navigation missing' }
          foreach ($marker in @('CmkLearningCatalog.Assess(', 'AnswerCommand', 'NextQuestionCommand', 'ResetSessionCommand', 'ChecklistProgress')) {
            if (-not $education.Contains($marker)) { throw "Missing TUR024 interactive VM marker: $marker" }
          }
          foreach ($marker in @('"cmk74"', '"cmk78-80"', '"cmk134"', '"cmk250-253"', '"tck75"', 'LegalComplianceCertified: false', 'NOT_VERIFIED')) {
            if (-not $catalog.Contains($marker)) { throw "TUR024 source-gated catalog incomplete: $marker" }
          }
          Write-Host 'Static WPF/CMK learning/official-source/UAT gates PASS; physical GUI test NOT_RUN.'
      - name: Hash-covered CI build provenance (unsigned metadata, not an approval)
        shell: pwsh
        run: |
          $head = '${{ github.event.pull_request.head.sha }}'
          if (-not $head) { $head = '${{ github.sha }}' }
          if ($head -notmatch '^[a-f0-9]{40}$') { throw 'No valid GitHub source head SHA.' }
          $record = [ordered]@{
            product = 'Embasic Legal Windows TUR024 Alpha'
            repository = 'ftmstr/Embasic-Legal-Build'
            git_head_sha = $head
            checkout_sha = (git rev-parse HEAD).Trim()
            github_run_id = $env:GITHUB_RUN_ID
            built_utc = (Get-Date).ToUniversalTime().ToString('o')
            legal_production = 'NO-GO'
            physical_windows_uat = 'NOT_RUN'
            official_legal_corpus = 'NOT_VERIFIED'
            official_court_originals = 'NOT_VERIFIED'
            E_terazi_redistribution = 'NOT_VERIFIED'
            GPLv3_MIT_license_resolution = 'NO-GO'
            evidence_grade = 'CI_UNSIGNED_HASHED_METADATA_NOT_PHYSICAL_ACCEPTANCE'
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'dist/EmbasicLegal/BUILD_PROVENANCE.json' -Encoding utf8
          Write-Host "TUR024 provenance created from GitHub head: $head"
      - name: SHA-256 evidence
        shell: pwsh
        run: |
          $exe = 'dist/EmbasicLegal/Embasic.Legal.exe'
          if (-not (Test-Path $exe)) { throw 'EXE missing' }
          Get-FileHash -Algorithm SHA256 $exe | Format-List | Out-File -Encoding utf8 dist/EmbasicLegal/EXE_SHA256.txt
          Get-ChildItem dist/EmbasicLegal -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding utf8 dist/EmbasicLegal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Embasic-Legal-TUR024-Windows-Alpha-NOT-FINAL
          path: dist/EmbasicLegal/
          if-no-files-found: error
