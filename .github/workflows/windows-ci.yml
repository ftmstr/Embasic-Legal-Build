name: Windows WPF Alpha CI
on:
  push:
    branches:
      - 'tur*/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  windows-build-test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Embasic.Legal.slnx
      - name: Build
        run: dotnet build Embasic.Legal.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Embasic.Legal.Tests/Embasic.Legal.Tests.csproj -c Release --no-restore --logger trx
      - name: Publish Windows standalone alpha
        run: dotnet publish src/Embasic.Legal.Desktop/Embasic.Legal.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o dist/EmbasicLegal
      - name: SHA-256 evidence
        shell: pwsh
        run: |
          $exe = 'dist/EmbasicLegal/Embasic.Legal.exe'
          if (-not (Test-Path $exe)) { throw 'EXE missing' }
          Get-FileHash -Algorithm SHA256 $exe | Format-List | Out-File -Encoding utf8 dist/EmbasicLegal/EXE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Embasic-Legal-TUR001-Windows-Alpha-NOT-FINAL
          path: dist/EmbasicLegal/
          if-no-files-found: error
