name: Windows WPF Alpha CI
on:
  push:
    branches:
      - 'tur*/**'
  pull_request:
    branches:
      - main
      - 'tur*/**'
permissions:
  contents: read
jobs:
  windows-build-test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Embasic.Legal.slnx
      - name: Build
        run: dotnet build Embasic.Legal.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Embasic.Legal.Tests/Embasic.Legal.Tests.csproj -c Release --no-restore --logger trx
      - name: Windows STA application navigation (not a physical GUI test)
        run: dotnet run --project tools/Embasic.Legal.NavigationSmoke/Embasic.Legal.NavigationSmoke.csproj -c Release --no-build --no-restore
      - name: Publish Windows standalone alpha
        run: dotnet publish src/Embasic.Legal.Desktop/Embasic.Legal.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o dist/EmbasicLegal
      - name: Source asset and legal source status
        shell: pwsh
        run: |
          if (-not (Test-Path assets/Embasic_Legal_E_Terazi.ico)) { throw "ICO missing" }
          if (-not (Test-Path assets/Embasic_Legal_E_Terazi_Ikon.png)) { throw "PNG missing" }
          if (-not (Test-Path assets/LOGO-PROVENANCE-TUR002.md)) { throw "Provenance record missing" }
          $expected = @{
            'assets/Embasic_Legal_E_Terazi.ico' = 'd63486e7e387146875f81c93c83dc94b9d931d63632bfb6eb878addd4840b489'
            'assets/Embasic_Legal_E_Terazi_Ikon.png' = 'ee0f9ed1c3c561e925d3374d07fa5e79ab678d9a07a9673ccffff1acc5c2599a'
          }
          foreach ($path in $expected.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$path]) { throw "Original logo source hash mismatch: $path" }
            Write-Host "$path $actual ORIGINAL_SOURCE_MATCH"
          }
      - name: Package manual offline Windows UAT collector
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'tools/TUR031-Windows-UAT.ps1' -Destination 'dist/EmbasicLegal/TUR031-Windows-UAT.ps1'
      - name: Static WPF and UAT syntax checks (NOT a physical GUI test)
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/TUR031-Windows-UAT.ps1',[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "PowerShell parser rejected UAT: $($parseErrors.Count)" }
          [xml]$screen = Get-Content 'src/Embasic.Legal.Desktop/App.xaml' -Raw
          $raw = $screen.OuterXml
          foreach ($marker in @('PenaltyMoneyViewModel','Ceza oran hesaplama','Hapis / para hesabı','YDO / para dönüşümü','SystematicsPage','Gece Vakti','SeizureTime','AYM İptali','AuthorizationBasis','ExportWitnessCommand','VerifyWitnessCommand','AuditLegacyExposureCommand')) {
            if (-not $raw.Contains($marker)) { throw "WPF source marker absent: $marker" }
          }
          $vm = Get-Content 'src/Embasic.Legal.Desktop/ViewModels/NoteSandboxViewModel.cs' -Raw
          foreach ($marker in @('AUTO_SQLITE_METADATA_CONSENT','AllowAutomaticSqliteBackup(forDelete: false)','AllowAutomaticSqliteBackup(forDelete: true)','RequireApprovalForDeletion()','_automaticBackupConsent.Reset()')) {
            if (-not $vm.Contains($marker)) { throw "Missing TUR031 consent marker: $marker" }
          }
          $riskGate = Get-Content 'src/Embasic.Legal.Infrastructure/VaultArtifactRiskGates.cs' -Raw
          foreach ($marker in @('File.GetAttributes(candidate)','FileNotFoundException','DirectoryNotFoundException','SQLite yan dosyasının varlığı/türü')) {
            if (-not $riskGate.Contains($marker)) { throw "TUR031 entry-type fail-closed marker absent: $marker" }
          }
          $vault = Get-Content 'src/Embasic.Legal.Infrastructure/EncryptedArticleNotes.cs' -Raw
          foreach ($marker in @('using var authenticated = new EncryptedArticleNotes(', 'readOnlyExisting: true', 'if (existing && !readOnlyExisting)')) {
            if (-not $vault.Contains($marker)) { throw "Missing TUR031 pre-auth read-only gate marker: $marker" }
          }
          $vaultGate = Get-Content 'src/Embasic.Legal.Infrastructure/EncryptedArticleNotes.cs' -Raw
          $entryIndex = $vaultGate.IndexOf('VaultArtifactRiskGates.RequireNoSqliteSidecars(fullPath);', [System.StringComparison]::Ordinal)
          $openIndex = $vaultGate.IndexOf('_store = new ArticleNoteStore(fullPath', [System.StringComparison]::Ordinal)
          if ($entryIndex -lt 0 -or $openIndex -lt 0 -or $entryIndex -gt $openIndex) {
            throw 'TUR031 normal vault startup sidecar guard absent or placed after SQLite open.'
          }
          $vaultRestore = Get-Content 'src/Embasic.Legal.Infrastructure/EncryptedArticleNotes.cs' -Raw
          $vaultArtifact = Get-Content 'src/Embasic.Legal.Infrastructure/VaultArtifactRiskGates.cs' -Raw
          foreach ($marker in @('RequireUnusedRollbackDestination(rollbackDestination)', 'RequireUnusedRollbackDestination(rollbackDestination!)')) {
            if (-not $vaultRestore.Contains($marker)) { throw "Missing TUR031 restore rollback guard marker: $marker" }
          }
          foreach ($marker in @('public static void RequireUnusedRollbackDestination', 'RequireNoSqliteSidecars(absolute)', 'File.GetAttributes(absolute)')) {
            if (-not $vaultArtifact.Contains($marker)) { throw "Missing TUR031 rollback destination entry gate: $marker" }
          }
          $app = Get-Content 'src/Embasic.Legal.Desktop/App.xaml' -Raw
          $main = Get-Content 'src/Embasic.Legal.Desktop/ViewModels/MainViewModel.cs' -Raw
          $education = Get-Content 'src/Embasic.Legal.Desktop/ViewModels/CmkLearningHubViewModel.cs' -Raw
          $catalog = Get-Content 'src/Embasic.Legal.Core/CmkLearningCatalog.cs' -Raw
          foreach ($marker in @('CmkLearningHubViewModel','Karşılaştırmalı kontrol matrisi','Yanıtı değerlendir','İşlem akışını öğren','NOT_VERIFIED')) {
            if (-not $app.Contains($marker)) { throw "Missing TUR031 WPF learning UI marker: $marker" }
          }
          if (-not $main.Contains('"learning" => OpenLearningCentre()')) { throw 'TUR031 navigation missing' }
          foreach ($marker in @('CmkLearningCatalog.Assess(', 'AnswerCommand', 'NextQuestionCommand', 'ResetSessionCommand', 'ChecklistProgress')) {
            if (-not $education.Contains($marker)) { throw "Missing TUR031 interactive VM marker: $marker" }
          }
          foreach ($marker in @('"cmk74"', '"cmk78-80"', '"cmk134"', '"cmk250-253"', '"tck75"', 'LegalComplianceCertified: false', 'NOT_VERIFIED')) {
            if (-not $catalog.Contains($marker)) { throw "TUR031 source-gated catalog incomplete: $marker" }
          }
          $checklistModel = Get-Content 'src/Embasic.Legal.Core/CmkLearningChecklistSession.cs' -Raw
          foreach ($marker in @('class CmkLearningChecklistSession','SetReviewed(string topicKey','IsReviewed(string topicKey','LegalComplianceCertified => false','NOT_VERIFIED')) {
            if (-not $checklistModel.Contains($marker)) { throw "TUR031 core topic checklist marker absent: $marker" }
          }
          foreach ($marker in @('new CmkLearningChecklistRow(', '_checklistSession.IsReviewed(topicKey, step.Order)', '_checklistSession.SetReviewed(topicKey, row.Order, row.Reviewed)', '_checklistSession.Reset()')) {
            if (-not $education.Contains($marker)) { throw "TUR031 topic state binding marker absent: $marker" }
          }
          foreach ($marker in @('Ceza Muhakemesi Hukuku', 'CmkCurriculum.Categories.Select', '_learningHub.OpenCategory(key[4..])')) {
            if (-not $main.Contains($marker)) { throw "Missing TUR031 category navigation: $marker" }
          }
          foreach ($marker in @('Binding Categories', 'Binding SelectedCategory', 'Binding Lesson.Concept', 'Binding Lesson.Distinction', 'Binding Lesson.Example', 'Binding RequestedDocumentUrl', 'Binding FlowChoices')) {
            if (-not $app.Contains($marker)) { throw "Missing TUR031 curriculum UI: $marker" }
          }
          foreach ($marker in @('Binding Study.Objectives', 'Binding RecallCards', 'Binding BranchChoices', 'Binding BranchFeedback', 'Binding Comparison', 'Binding ActiveFlow.ReviewPrompt')) {
            if (-not $app.Contains($marker)) { throw "Missing TUR031 active-learning UI: $marker" }
          }
          $agenda = Get-Content 'src/Embasic.Legal.Core/CmkReviewAgendaPlanner.cs' -Raw
          foreach ($marker in @('CmkReviewAgendaPlanner', 'IncorrectFirstAnswers', 'CmkRecallRating.Review', 'NOT_VERIFIED', 'LegalComplianceCertified => false')) {
            if (-not $agenda.Contains($marker)) { throw "TUR031 targeted revision source marker missing: $marker" }
          }
          foreach ($marker in @('ReviewAgendaSummary','OpenReviewTopicCommand','NotifyReviewAgendaChanged()','CmkCurriculum.CentralTopics, _answered, _correct')) {
            if (-not $education.Contains($marker)) { throw "TUR031 revision navigation marker missing: $marker" }
          }
          foreach ($marker in @('Header="5 · Tekrar"','Binding ReviewAgenda','Binding ReviewAgendaSummary','DataContext.OpenReviewTopicCommand','Header="6 · Kaynak ve güvenlik"')) {
            if (-not $app.Contains($marker)) { throw "TUR031 revision WPF binding marker missing: $marker" }
          }
          # TUR031: static UI structure checks. Compile and STA checks are
          # real Windows CI; they do NOT prove physical 900-DIP / high-DPI GUI.
          $tStart = $app.IndexOf('<TabItem Header="2 · Tablo">', [StringComparison]::Ordinal)
          $tEnd = $app.IndexOf('<TabItem Header="3 · Kontrol listesi">', [StringComparison]::Ordinal)
          if ($tStart -lt 0 -or $tEnd -le $tStart) { throw "TUR031 compare-tab bounds missing" }
          $section = $app.Substring($tStart, $tEnd-$tStart)
          foreach ($marker in @('Okuma kartları · dar pencere için',
            'ItemsSource="{Binding Comparison}"', 'ItemsSource="{Binding Matrix}"',
            'CMK karşılaştırma okuma kartları', 'CMK işlem kontrol okuma kartları',
            'Text="{Binding Reason}" TextWrapping="Wrap"',
            'Text="{Binding UnresolvedRisk}" TextWrapping="Wrap"',
            '<Expander Header="Geniş dört sütunlu tabloyu göster · yatay kaydırma"',
            'IsExpanded="False"', 'HorizontalScrollBarVisibility="Auto"')) {
            if (-not $section.Contains($marker)) { throw "TUR031 readable comparison marker missing: $marker" }
          }
          $expanderPos = $section.IndexOf('<Expander Header=', [StringComparison]::Ordinal)
          $gridPos = $section.IndexOf('<DataGrid ', [StringComparison]::Ordinal)
          if ($expanderPos -lt 0 -or $gridPos -le $expanderPos) {
            throw "TUR031 tables must be inside opt-in expander, after readable cards"
          }
          if ([regex]::Matches($section, '<DataGrid ').Count -ne 2 -or
              [regex]::Matches($section, '<ItemsControl ').Count -ne 2) {
            throw 'TUR031 must retain 2 legacy grids + 2 alternative card presentations'
          }
          Write-Host 'Static WPF/CMK responsive read-only cards + opt-in original grids, source gates and UAT syntax PASS; physical GUI/DPI NOT_RUN.'
      - name: Hash-covered CI build provenance (unsigned metadata, not an approval)
        shell: pwsh
        run: |
          $head = '${{ github.event.pull_request.head.sha }}'
          if (-not $head) { $head = '${{ github.sha }}' }
          if ($head -notmatch '^[a-f0-9]{40}$') { throw 'No valid GitHub source head SHA.' }
          $record = [ordered]@{
            product = 'Embasic Legal Windows TUR031 Alpha'
            repository = 'ftmstr/Embasic-Legal-Build'
            git_head_sha = $head
            checkout_sha = (git rev-parse HEAD).Trim()
            github_run_id = $env:GITHUB_RUN_ID
            built_utc = (Get-Date).ToUniversalTime().ToString('o')
            legal_production = 'NO-GO'
            physical_windows_uat = 'NOT_RUN'
            official_legal_corpus = 'NOT_VERIFIED'
            official_court_originals = 'NOT_VERIFIED'
            E_terazi_redistribution = 'NOT_VERIFIED'
            GPLv3_MIT_license_resolution = 'NO-GO'
            evidence_grade = 'CI_UNSIGNED_HASHED_METADATA_NOT_PHYSICAL_ACCEPTANCE'
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'dist/EmbasicLegal/BUILD_PROVENANCE.json' -Encoding utf8
          Write-Host "TUR031 provenance created from GitHub head: $head"
      - name: SHA-256 evidence
        shell: pwsh
        run: |
          $exe = 'dist/EmbasicLegal/Embasic.Legal.exe'
          if (-not (Test-Path $exe)) { throw 'EXE missing' }
          Get-FileHash -Algorithm SHA256 $exe | Format-List | Out-File -Encoding utf8 dist/EmbasicLegal/EXE_SHA256.txt
          Get-ChildItem dist/EmbasicLegal -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding utf8 dist/EmbasicLegal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Embasic-Legal-TUR031-Windows-Alpha-NOT-FINAL
          path: dist/EmbasicLegal/
          if-no-files-found: error
