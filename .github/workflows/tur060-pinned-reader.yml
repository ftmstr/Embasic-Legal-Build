name: TUR060 additional provision pinned reader (NOT release)
on:
  push:
    branches: ['audit/tur035-nuget-byte-parity']
    paths: ['.github/workflows/tur060-pinned-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15057816038'
          run-id: '45687953803'
          github-token: ${{ github.token }}
          path: prior49
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15056664563'
          run-id: '45688754638'
          github-token: ${{ github.token }}
          path: prior50
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15058496001'
          run-id: '45689770047'
          github-token: ${{ github.token }}
          path: prior51
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060085952'
          run-id: '45693327586'
          github-token: ${{ github.token }}
          path: prior52
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060641088'
          run-id: '45694684288'
          github-token: ${{ github.token }}
          path: prior53
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15060707849'
          run-id: '45696360940'
          github-token: ${{ github.token }}
          path: prior54
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15064090183'
          run-id: '45700585363'
          github-token: ${{ github.token }}
          path: prior55
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093086567'
          run-id: '45768293248'
          github-token: ${{ github.token }}
          path: prior56
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15093895209'
          run-id: '45769614123'
          github-token: ${{ github.token }}
          path: prior57
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15124392385'
          run-id: '45834946840'
          github-token: ${{ github.token }}
          path: prior58
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15137949379'
          run-id: '45862843182'
          github-token: ${{ github.token }}
          path: prior59
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15144913108'
          run-id: '45876381548'
          github-token: ${{ github.token }}
          path: prior60
      - name: Verify new exact snapshot and distinct additional article identity
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess,sys,sqlite3,tempfile,shutil
          paths={f"TUR{i:03d}":next(pathlib.Path(f"prior{i}").rglob("reader-candidate.sqlite")) for i in range(49,61)}
          r=pathlib.Path("tur060-pin-evidence");r.mkdir()
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          before={k:sha(p) for k,p in paths.items()}
          checks=[]
          def test(n,v):
              assert v,n
              checks.append({"case":n,"pass":True})
          def call(rev,aid,generic=False,path=None):
              p=path or paths[rev]
              args=["tools/audit_candidate_reader.py","--db",str(p),"--expected-sha256",sha(p)] if generic else ["tools/audit_pinned_reader.py","--db",str(p),"--revision",rev]
              return subprocess.run([sys.executable,*args,"--article",aid],capture_output=True,text=True,encoding="utf-8")
          def denied(p,reason):return p.returncode==65 and not p.stdout and json.loads(p.stderr)["reason"]==reason
          def aid(n):return f"2918:normal:{n}"
          m,e=aid(65),"2918:ek:2"
          for rev in list(paths)[:-1]:
              test(rev+"_m65_ek2_quarantine",all(denied(call(rev,a,g),"REVISION_ARTICLE_QUARANTINED") for a in (m,e) for g in (False,True)))
          for a,coords,title,kind in [(m,[(53,o) for o in range(25,33)]+[(54,o) for o in range(39)]+[(55,o) for o in range(18)],"Yüklü ve yüksüz araçlar:49","normal"),(e,[(87,o) for o in range(4,35)]+[(88,0)],"Araçların tescil edildikleri amacın dışında kullanılması:","ek")]:
              q=call("TUR060",a);v=json.loads(q.stdout)
              test(a+"_exact_body_title_kind",q.returncode==0 and v["id"]==a and v["kind"]==kind and [(x["page"],x["ordinal"]) for x in v["body"]]==coords and v["annotations"][0]["text"]==title and v["evidence"]["artifact"]==15144913108 and not v["promotion_allowed"])
              q=call("TUR060",a,True)
              test(a+"_generic_exact_match",q.returncode==0 and json.loads(q.stdout)["body"]==v["body"] and json.loads(q.stdout)["annotations"]==v["annotations"])
          q=call("TUR060",m);v=json.loads(q.stdout)
          test("m65_exact_22_note_lines",[(x["page"],x["ordinal"]) for x in v["annotations"] if x["type"]=="FOOTNOTE"]==[(53,o) for o in range(33,39)]+[(55,o) for o in range(26,42)])
          q=call("TUR060",e);v=json.loads(q.stdout)
          test("ek2_exact_note88",[(x["page"],x["ordinal"]) for x in v["annotations"] if x["type"]=="FOOTNOTE"]==[(87,o) for o in range(35,38)])
          test("temporary_2_remains_held",all(denied(call("TUR060","2918:geçici:2",g),"WITHHELD_REVIEW") for g in (False,True)))
          test("normal_2_distinct_from_ek2",json.loads(call("TUR060",aid(2)).stdout)["kind"]=="normal" and json.loads(call("TUR060",aid(2)).stdout)["body"]!=v["body"])
          prior=[aid(n) for n in (2,47,3,45,4,46,28,29,49)]+["2918:geçici:27"]
          for a in prior:
              old=call("TUR059",a);new=call("TUR060",a);generic=call("TUR060",a,True)
              test(a+"_prior_exact_body_and_annotations_preserved",old.returncode==new.returncode==generic.returncode==0 and all(json.loads(old.stdout)[k]==json.loads(new.stdout)[k]==json.loads(generic.stdout)[k] for k in ("body","annotations","status","promotion_allowed")))
          test("cross_revision_hash_rejected",denied(call("TUR060",m,path=paths["TUR059"]),"HASH_MISMATCH"))
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/"tamper.sqlite";shutil.copyfile(paths["TUR060"],p)
              db=sqlite3.connect(p);db.execute("UPDATE reader_line SET body='synthetic changed text' WHERE article_id=? AND page=53 AND ordinal=25",(m,));db.commit();db.close()
              test("self_hash_tampered_snapshot_denied",all(denied(call("TUR060",a,True,path=p),"REVISION_ARTICLE_QUARANTINED") for a in prior+[m,e]) and denied(call("TUR060",m,path=p),"HASH_MISMATCH"))
          test("all_twelve_original_bytes_unchanged",before=={k:sha(p) for k,p in paths.items()})
          out={"status":"PINNED_AUDIT_READER_ONLY","promotion_allowed":False,"production":"NO-GO","official_legal_source":"NOT_VERIFIED","physical_uat":"NOT_RUN","checks":checks,"input_hashes":before,"wrapper_sha256":sha(pathlib.Path("tools/audit_pinned_reader.py")),"generic_reader_sha256":sha(pathlib.Path("tools/audit_candidate_reader.py")),"limitations":["current reader only; historical source and direct SQLite remain available","no general freshness or digital signature","no Windows product integration"]}
          (r/"result.json").write_text(json.dumps(out,indent=2),encoding="utf-8");print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TUR060-Pinned-Reader-Evidence-NOT-RELEASE
          path: tur060-pin-evidence/
          if-no-files-found: error
